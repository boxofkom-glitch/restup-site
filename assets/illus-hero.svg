<text x="340" y="222" fill="#F7F7F7" font-family="Urbanist, sans-serif" font-size="22" font-weight="800">100+</text>
<text x="340" y="242" fill="#9A9A9A" font-family="Urbanist, sans-serif" font-size="12" font-weight="600">restaurants</text>
