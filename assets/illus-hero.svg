  <use href="#shopH" x="382" y="92" width="24" height="24"/>
</g>
<g color="#22C55E">
  <use href="#shopH" x="404" y="146" width="28" height="28"/>
</g>
<g color="#4fd98c">
  <use href="#shopH" x="358" y="152" width="20" height="20"/>
</g>
<g color="#6fe3a3">
  <use href="#shopH" x="412" y="56" width="20" height="20"/>
</g>
<g color="#3fce7c">
  <use href="#shopH" x="322" y="128" width="18" height="18"/>
</g>
<g color="#6fe3a3">
  <use href="#shopH" x="392" y="20" width="16" height="16"/>
