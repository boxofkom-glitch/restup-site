<svg viewBox="0 0 480 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration d'un restaurant qui se transforme en réseau de plus de 100 enseignes">
<defs>
  <radialGradient id="bgGlowH" cx="55%" cy="24%" r="75%">
    <stop offset="0%" stop-color="#182b1e"/>
    <stop offset="55%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#0a0a0a"/>
  </radialGradient>
  <radialGradient id="limeGlowH" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22C55E" stop-opacity="0.38"/>
    <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
  </radialGradient>
  <symbol id="shopH" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"/>
      <path d="M5 21V10.5"/>
      <path d="M19 21V10.5"/>
      <path d="M3 10.5 4.3 5h15.4L21 10.5"/>
      <path d="M3 10.5h18"/>
      <rect x="10" y="15" width="4" height="6"/>
    </g>
  </symbol>
  <pattern id="dotsH" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="rgba(255,255,255,0.055)"/>
  </pattern>
</defs>

<rect width="480" height="600" fill="url(#bgGlowH)"/>
<rect width="480" height="600" fill="url(#dotsH)"/>

<circle cx="378" cy="110" r="150" fill="url(#limeGlowH)"/>

<path d="M92 500 C 150 480, 170 390, 235 350 S 330 250, 392 130" fill="none" stroke="#3fce7c" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="1.5 11" stroke-linecap="round"/>

<use href="#shopH" x="48" y="462" width="96" height="96" color="#22C55E"/>
<text x="52" y="586" fill="#9A9A9A" font-family="Urbanist, sans-serif" font-size="14" font-weight="600">1 restaurant à Bordeaux</text>

<g color="#22C55E">
  <use href="#shopH" x="336" y="66" width="34" height="34"/>
</g>
