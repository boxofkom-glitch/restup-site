<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Créer mon mot de passe — RESTUP</title>
<meta name="theme-color" content="#0B0D0C">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230B0D0C'/%3E%3Ctext x='8' y='29' font-family='Arial' font-size='29' font-weight='bold' fill='%239B4DFF'%3ER%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="RESTUP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../style.css">
<style>
.portal-hero{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(120% 130% at 78% 28%,#4a2482 0%,#1c0e33 45%,var(--ink) 78%)}
.portal-topbar{display:flex;justify-content:center;align-items:center;padding:32px 24px}
.portal-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.pw-card{width:100%;max-width:420px;background:#fff;border-top:6px solid var(--lime);border-radius:var(--radius);padding:40px 32px 32px;text-align:center}
.pw-card .badge{font-size:11px;font-weight:700;letter-spacing:1.7px;color:var(--lime);margin:0 0 8px}
.pw-card h1{font-family:var(--font-display);text-transform:uppercase;font-weight:400;font-size:26px;letter-spacing:-.5px;margin:0 0 10px}
.pw-card p.hint{color:var(--muted);font-size:14px;margin:0 0 24px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:15px}
.field input:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.pw-field{position:relative}
.pw-toggle{position:absolute;right:6px;top:29px;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;font-size:11px;font-weight:700}
.pw-toggle:hover{color:var(--ink)}
.msg{font-size:13px;margin:0 0 14px;min-height:1px}
.msg.error{color:#c0392b}
.msg.ok{color:#1f8a4c}
.state-loading,.state-error{color:#fff;text-align:center}
.state-loading .spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--lime);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="portal-hero">
  <div class="portal-topbar">
    <a class="wordmark" href="../index.html" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
  </div>
  <div class="portal-main">

    <div id="loadingState" class="state-loading">
      <span class="spinner"></span>
      <p>Vérification du lien…</p>
    </div>

    <div id="errorState" class="state-error" style="display:none;max-width:380px;padding:0 20px;">
      <p style="font-weight:700;font-size:17px;margin-bottom:6px;">Ce lien n'est plus valide</p>
      <p style="opacity:.75;font-size:14px;margin-bottom:18px;">Il a expiré ou a déjà été utilisé. Renseigne ton email : si un accès existe, tu recevras un nouveau lien.</p>
      <div class="field" style="text-align:left;"><input id="resendEmail" type="email" placeholder="ton@email.fr" autocomplete="email" style="background:#fff;"></div>
      <button class="button lime" type="button" id="resendBtn" style="width:100%;">Recevoir un nouveau lien</button>
      <p id="resendMsg" class="msg" style="margin-top:12px;color:#fff;"></p>
      <p style="margin-top:14px;"><a href="login.html" style="color:#c9a8ff;font-weight:700;">Retour à la connexion →</a></p>
    </div>

    <div id="pwCard" class="pw-card" style="display:none;">
      <p class="badge" id="roleLabel">BIENVENUE</p>
      <h1>Bienvenue sur RestUp</h1>
      <p class="hint">Créez votre mot de passe pour accéder à votre espace.</p>
      <div id="formMsg" class="msg"></div>
      <form id="pwForm">
        <div class="field pw-field"><label for="pw1">Mot de passe (min. 8 caractères)</label><input id="pw1" type="password" required minlength="8" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="pw1">Afficher</button></div>
        <div class="field pw-field"><label for="pw2">Confirmer le mot de passe</label><input id="pw2" type="password" required minlength="8" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="pw2">Afficher</button></div>
        <button class="button lime" type="submit" id="pwBtn" style="width:100%;">Créer mon mot de passe</button>
      </form>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-client.js?v=4"></script>
<script>
(async function () {
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Masquer' : 'Afficher';
    });
  });

  function showMsg(text, type) {
    const el = document.getElementById('formMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // Le lien d'invitation / récupération établit la session via le hash de l'URL.
  let session = null;
  const hashErr = /error/.test(location.hash);
  for (let i = 0; i < (hashErr ? 0 : 20) && !session; i++) {
    const { data } = await supabaseClient.auth.getSession();
    session = data.session;
    if (!session) await new Promise(r => setTimeout(r, 250));
  }

  document.getElementById('loadingState').style.display = 'none';
  if (!session) {
    document.getElementById('errorState').style.display = 'block';
    let sending = false;
    document.getElementById('resendBtn').addEventListener('click', async () => {
      if (sending) return;
      const email = document.getElementById('resendEmail').value.trim();
      const m = document.getElementById('resendMsg');
      if (!email) { m.textContent = 'Renseigne ton email.'; return; }
      sending = true;
      // shouldCreateUser:false → ne crée jamais de compte ; répond de la même façon dans tous les cas.
      await supabaseClient.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: PROD_ORIGIN + '/portail/set-password.html' } });
      m.textContent = 'Si un accès existe pour cet email, un nouveau lien vient d\'être envoyé.';
      sending = false;
    });
    return;
  }
  document.getElementById('pwCard').style.display = 'block';

  let submitting = false;
  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submitting) return; // anti double-submit
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw1.length < 8) { showMsg('Le mot de passe doit faire au moins 8 caractères.', 'error'); return; }
    if (pw1 !== pw2) { showMsg('Les mots de passe ne correspondent pas.', 'error'); return; }
    submitting = true;
    const btn = document.getElementById('pwBtn');
    btn.disabled = true; btn.textContent = 'Création...';

    const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
    if (error) { submitting = false; btn.disabled = false; btn.textContent = 'Créer mon mot de passe'; showMsg(error.message, 'error'); return; }

    // Activation côté serveur : rattache le compte à son invitation (rôle, coach, infos), journalise l'événement.
    let role = 'client';
    try {
      const { data: claim } = await supabaseClient.rpc('restup_claim_account');
      if (claim && claim.role) role = claim.role;
    } catch (err) { /* fonction absente : on retombe sur le rôle déduit du compte */ }
    try { role = (await restupRole(session.user)) === 'client' ? 'client' : 'coach'; } catch (err) {}

    showMsg('Mot de passe créé ! Redirection...', 'ok');
    setTimeout(() => { window.location.href = role === 'client' ? 'dashboard.html' : 'admin/index.html'; }, 700);
  });
})();
</script>
</body>
</html>
