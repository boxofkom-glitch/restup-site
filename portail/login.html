<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion — RESTUP</title>
<meta name="theme-color" content="#0B0D0C">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230B0D0C'/%3E%3Ctext x='8' y='29' font-family='Arial' font-size='29' font-weight='bold' fill='%239B4DFF'%3ER%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="RESTUP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../style.css">
<style>
.portal-hero{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(120% 130% at 22% 18%,#4a2482 0%,#1c0e33 45%,var(--ink) 78%)}
.portal-topbar{display:flex;justify-content:space-between;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 56px 28px}
.portal-back{color:#fff;font-size:14px;font-weight:600;opacity:.75;transition:opacity .2s}
.portal-back:hover{opacity:1}
.portal-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
.portal-main h1{font-family:var(--font-display);text-transform:uppercase;font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.02;letter-spacing:-1px;color:#fff;margin:0 0 30px}
.portal-main h1 span{display:block;color:#9B4DFF}
.login-card{width:100%;max-width:400px;background:#fff;border-top:6px solid #9B4DFF;border-radius:var(--radius);padding:34px 30px 28px;text-align:left}
.login-card h2{font-family:var(--font-display);text-transform:uppercase;font-weight:400;font-size:24px;letter-spacing:-.5px;margin:0 0 6px}
.login-card p.sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:650;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:15px}
.field input:focus-visible{outline:2px solid #9B4DFF;outline-offset:1px}
.pw-field{position:relative}
.pw-toggle{position:absolute;right:6px;top:29px;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;font-size:11px;font-weight:700}
.pw-toggle:hover{color:var(--ink)}
.msg{font-size:13px;margin:0 0 14px;min-height:1px}
.msg.error{color:#c0392b}
.msg.ok{color:#1f8a4c}
.login-btn{width:100%;background:#fff;color:#6d2fd0;border:0;border-radius:999px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .18s,box-shadow .18s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -12px rgba(155,77,255,.8)}
.login-btn:disabled{opacity:.6;cursor:default;transform:none}
.link-btn{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:14px;cursor:pointer;width:100%;text-align:center}
.link-btn:hover{color:var(--ink)}
.invite-note{margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.65);max-width:400px}
@media(max-width:760px){.portal-topbar{padding:20px}.login-card{padding:28px 22px 24px}}
</style>
</head>
<body>

<div class="portal-hero">
  <div class="portal-topbar">
    <a class="wordmark" href="../index.html" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
    <a class="portal-back" href="../index.html">← Retour au site</a>
  </div>
  <div class="portal-main">
    <h1>Tu vas enfin<span>pouvoir respirer.</span></h1>
    <div class="login-card">
      <h2>Connexion</h2>
      <p class="sub">Accède à ton espace RestUp.</p>
      <div id="formMsg" class="msg" role="status"></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="email" inputmode="email"></div>
        <div class="field pw-field"><label for="loginPass">Mot de passe</label><input id="loginPass" type="password" required autocomplete="current-password"><button type="button" class="pw-toggle" id="pwToggle">Afficher</button></div>
        <button class="login-btn" type="submit" id="loginBtn">Se connecter</button>
        <button type="button" class="link-btn" id="forgotPwBtn">Mot de passe oublié ?</button>
      </form>
    </div>
    <p class="invite-note">L'accès à RestUp se fait sur invitation. Tu n'as pas reçu ton email d'invitation ? Contacte ton coach.</p>
  </div>
</div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-client.js?v=7"></script>
<script>
function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

// Le rôle vient du compte : équipe → cockpit ; client → onboarding ou accueil.
async function redirectAfterAuth() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) return;
  const role = await restupRole(data.session.user);
  if (role === 'admin' || role === 'coach') { window.location.href = 'admin/index.html'; return; }
  window.location.href = 'dashboard.html'; // dashboard.html redirige vers l'onboarding si incomplet
}

supabaseClient.auth.getSession().then(({ data }) => { if (data.session) redirectAfterAuth(); });

document.getElementById('pwToggle').addEventListener('click', (e) => {
  const input = document.getElementById('loginPass');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  e.target.textContent = show ? 'Masquer' : 'Afficher';
});

let submitting = false;
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (submitting) return; // anti double-submit
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  if (!email || !password) { showMsg('Renseigne ton email et ton mot de passe.', 'error'); return; }
  submitting = true;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Connexion...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  submitting = false;
  btn.disabled = false; btn.textContent = 'Se connecter';
  if (error) {
    showMsg(/invalid login/i.test(error.message) ? 'Email ou mot de passe incorrect.' : 'Connexion impossible : ' + error.message, 'error');
    return;
  }
  await redirectAfterAuth();
});

document.getElementById('forgotPwBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showMsg('Renseigne ton email ci-dessus, puis clique à nouveau.', 'error'); return; }
  // Ne révèle pas si le compte existe.
  await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: PROD_ORIGIN + '/portail/set-password.html?mode=reset' });
  showMsg('Si un compte existe pour ' + email + ', un email de réinitialisation vient d\'être envoyé.', 'ok');
});
</script>
</body>
</html>
