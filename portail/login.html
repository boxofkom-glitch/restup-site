<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="../assets/logo-restup-wordmark.png">
<title>Espace client — RestUp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
body{display:flex;flex-direction:column;min-height:100vh;position:relative;overflow-x:hidden;}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
.login-card{width:100%;max-width:400px;}
.tabs{position:relative;display:flex;gap:0;margin-bottom:24px;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px;}
.tab-indicator{position:absolute;top:5px;left:5px;width:calc(50% - 5px);height:calc(100% - 10px);background:var(--lime);border-radius:999px;transition:transform .3s cubic-bezier(.2,.9,.2,1);z-index:0;}
.tab{position:relative;z-index:1;flex:1;text-align:center;padding:10px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted);transition:color .25s;}
.tab.active{color:var(--ink);}
.logo-center{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:22px;margin-bottom:28px;text-decoration:none;color:#fff;}
.pw-field{position:relative;}
.pw-toggle{position:absolute;right:6px;top:29px;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;font-size:12px;font-weight:700;}
.pw-toggle:hover{color:#fff;}
.form-swap{transition:opacity .25s ease;}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#1a1a1a;font-weight:700;font-size:14px;padding:12px 16px;border-radius:999px;border:none;cursor:pointer;margin-bottom:18px;transition:transform .18s,box-shadow .18s;}
.oauth-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(255,255,255,.25);}
.oauth-btn svg{width:18px;height:18px;flex:0 0 auto;}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:var(--muted-dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
.pac-container{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);font-family:'Urbanist',sans-serif;overflow:hidden;margin-top:4px;}
.pac-item{color:var(--muted);border-color:var(--line);padding:9px 12px;font-size:13.5px;}
.pac-item:hover{background:rgba(255,255,255,.05);}
.pac-item-query{color:#fff;}
.pac-icon{filter:invert(1) grayscale(1) brightness(1.6);}
</style>
</head>
<body>

<span class="glow glow-a" style="width:480px;height:480px;background:radial-gradient(circle,rgba(34,197,94,.14),transparent 70%);top:-160px;right:-140px;position:fixed;"></span>
<span class="glow glow-b" style="width:420px;height:420px;background:radial-gradient(circle,rgba(22,163,74,.10),transparent 70%);bottom:-160px;left:-120px;position:fixed;"></span>

<div class="login-wrap">
  <div class="login-card card glow-card tilt reveal in-view">
    <a href="../index.html" class="logo-center"><img src="../assets/logo-restup-wordmark.png" alt="RestUp" class="logo-wordmark"></a>

    <div class="tabs">
      <div class="tab-indicator" id="tabIndicator"></div>
      <div class="tab active" data-tab="login">Connexion</div>
      <div class="tab" data-tab="signup">Créer un compte</div>
    </div>

    <button type="button" class="oauth-btn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 7.1 29.5 5 24 5c-7.7 0-14.4 4.4-17.7 9.7z"/><path fill="#4CAF50" d="M24 43c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 34.4 26.8 35 24 35c-5.3 0-9.7-3.6-11.3-8.4l-6.5 5C9.5 38.5 16.2 43 24 43z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.3 5.3C40.7 36.6 43 30.9 43 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Continuer avec Google
    </button>
    <div class="divider">ou</div>

    <div id="formMsg" class="msg"></div>

    <form id="loginForm" class="form-swap">
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" required autocomplete="email"></div>
      <div class="field pw-field"><label for="loginPass">Mot de passe</label><input id="loginPass" type="password" required autocomplete="current-password"><button type="button" class="pw-toggle" data-target="loginPass">Afficher</button></div>
      <button class="btn-primary magnetic" type="submit" id="loginBtn" style="width:100%;">Se connecter</button>
    </form>

    <form id="signupForm" class="form-swap" style="display:none;">
      <div class="field"><label for="signupName">Nom de l'établissement</label><input id="signupName" required autocomplete="organization"></div>
      <div class="field"><label for="signupBusiness">Établissement (adresse)</label><input id="signupBusiness" placeholder="Commencez à taper une adresse..." autocomplete="off"></div>
      <div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" required autocomplete="email"></div>
      <div class="field pw-field"><label for="signupPass">Mot de passe (min. 6 caractères)</label><input id="signupPass" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="pw-toggle" data-target="signupPass">Afficher</button></div>
      <button class="btn-primary magnetic" type="submit" id="signupBtn" style="width:100%;">Créer mon compte</button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:13px;"><a href="../index.html" style="color:var(--muted);text-decoration:none;">← Retour au site</a></p>
  </div>
</div>

<script src="../script.js"></script>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
// ---- Redirection selon le rôle : coach (admin) ou client ----
async function redirectAfterAuth() {
  try {
    const { data: sess } = await supabaseClient.auth.getSession();
    if (!sess.session) return;
    const { data: adminRow } = await supabaseClient
      .from('admins').select('user_id').eq('user_id', sess.session.user.id).maybeSingle();
    window.location.href = adminRow ? 'admin/index.html' : 'dashboard.html';
  } catch (e) {
    window.location.href = 'dashboard.html';
  }
}

// ---- Auto-complétion d'adresse d'établissement (optionnelle, voir config.js) ----
let selectedBusiness = null;
if (GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY.indexOf('REMPLACEZ') !== 0) {
  const gmapsScript = document.createElement('script');
  gmapsScript.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places&loading=async`;
  gmapsScript.async = true;
  gmapsScript.onload = () => {
    const input = document.getElementById('signupBusiness');
    const autocomplete = new google.maps.places.Autocomplete(input, { fields: ['name', 'formatted_address', 'geometry', 'place_id'] });
    autocomplete.addListener('place_changed', () => {
      const place = autocomplete.getPlace();
      selectedBusiness = {
        name: place.name || input.value,
        address: place.formatted_address || '',
        lat: place.geometry?.location?.lat() ?? null,
        lng: place.geometry?.location?.lng() ?? null,
        place_id: place.place_id || ''
      };
    });
  };
  document.head.appendChild(gmapsScript);
}

// ---- Connexion Google (via Supabase Auth) ----
document.getElementById('googleBtn').addEventListener('click', async () => {
  const { error } = await supabaseClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
  if (error) showMsg(error.message, 'error');
});

// Bascule connexion / inscription (avec indicateur glissant)
const tabIndicator = document.getElementById('tabIndicator');
document.querySelectorAll('.tab').forEach((t, i) => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    tabIndicator.style.transform = i === 0 ? 'translateX(0)' : 'translateX(100%)';
    const isLogin = t.dataset.tab === 'login';
    document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
    document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
    document.getElementById('formMsg').className = 'msg';
  });
});

// Afficher / masquer le mot de passe
document.querySelectorAll('.pw-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Masquer' : 'Afficher';
  });
});

function showMsg(text, type) {
  const el = document.getElementById('formMsg');
  el.textContent = text;
  el.className = 'msg ' + type;
  if (window.toast) toast(text, type === 'ok' ? 'ok' : 'error');
}

// Si déjà connecté, direction le bon espace (coach ou client)
supabaseClient.auth.getSession().then(({ data }) => {
  if (data.session) redirectAfterAuth();
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Connexion...';
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPass').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Se connecter';
  if (error) { showMsg(error.message, 'error'); return; }
  await redirectAfterAuth();
});

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Création...';
  const company = document.getElementById('signupName').value;
  const email = document.getElementById('signupEmail').value;
  const password = document.getElementById('signupPass').value;
  const businessInput = document.getElementById('signupBusiness').value;
  const metadata = { company_name: company };
  if (selectedBusiness) {
    metadata.business_name = selectedBusiness.name;
    metadata.business_address = selectedBusiness.address;
    metadata.business_lat = selectedBusiness.lat;
    metadata.business_lng = selectedBusiness.lng;
    metadata.business_place_id = selectedBusiness.place_id;
  } else if (businessInput) {
    metadata.business_address = businessInput;
  }
  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: { data: metadata }
  });
  btn.disabled = false; btn.textContent = 'Créer mon compte';
  if (error) { showMsg(error.message, 'error'); return; }
  showMsg('Compte créé ! Si la confirmation par email est activée, vérifiez votre boîte mail. Sinon vous êtes connecté.', 'ok');
  if (data.session) setTimeout(() => window.location.href = 'dashboard.html', 1200);
});
</script>
</body>
</html>
