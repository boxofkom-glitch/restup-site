<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="../../assets/logo-restup-wordmark.png">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="RESTUP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Agenda — Espace coach RESTUP</title>
<link rel="stylesheet" href="admin-theme.css">
<style>
body{overflow-x:hidden;}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:color .2s,border-color .2s;}
.icon-btn:hover{color:#fff;border-color:var(--muted);}
.icon-btn svg{width:16px;height:16px;}

/* ---- Sidebar shell (espace coach) ---- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.sidebar .wordmark{padding:0 6px;margin-bottom:18px;}
.side-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-dim);padding:14px 14px 6px;}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-md);color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;cursor:pointer;transition:background .2s,color .2s;background:transparent;border:none;text-align:left;width:100%;font-family:inherit;}
.side-link svg{width:17px;height:17px;stroke:currentColor;flex:0 0 auto;}
.side-link:hover{background:rgba(255,255,255,.04);color:#fff;}
.side-link.active{background:var(--lime-dim);color:var(--lime);}
.side-link.soon{opacity:.5;cursor:default;}
.side-link .soon-tag{margin-left:auto;font-size:9.5px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--muted-dim);padding:2px 7px;border-radius:999px;}
.side-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:#1c0e33;border:1px solid rgba(155,77,255,.55);color:#B37BFF;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.side-foot-info{flex:1;min-width:0;}
.side-foot-info b{display:block;font-size:13px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-foot-info span{font-size:11px;color:var(--muted-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.mobile-topbar{display:none;position:sticky;top:0;z-index:50;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(20,20,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.mobile-topbar .wordmark{font-size:18px;}
.mobile-nav-toggle{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-105%);transition:transform .3s ease;z-index:80;box-shadow:0 0 60px rgba(0,0,0,.5);}
  body.nav-open .sidebar{transform:translateX(0);}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;}
  .mobile-topbar{display:flex;}
}
.main{flex:1;min-width:0;}

.admin-main{max-width:1080px;margin:0 auto;padding:30px 24px 70px;}
.page-title-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-title-row h1{font-size:clamp(22px,3vw,30px);}
.page-title-row p{margin-top:4px;font-size:14px;color:var(--muted);}
.empty-state{font-size:13.5px;color:var(--muted-dim);text-align:center;padding:40px 0;}
.table-scroll{overflow-x:auto;overflow-y:hidden;}

.call-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);}
.call-item:last-child{border-bottom:none;}
.call-item .client-name{font-weight:700;color:#fff;font-size:14px;text-decoration:none;}
.call-when{font-size:13px;color:var(--muted);margin-top:2px;}
.call-notes{font-size:12.5px;color:var(--muted-dim);margin-top:2px;}
.call-badge{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px;flex:0 0 auto;}
.call-badge.confirmed{background:var(--lime-dim);color:var(--lime);}
.call-badge.requested{background:rgba(255,190,60,.12);color:#ffc94d;}
.call-badge.done{background:rgba(255,255,255,.06);color:var(--muted);}

/* ---- Agenda hebdomadaire plein écran, sans scroll ---- */
.agenda-page{height:100vh;display:flex;flex-direction:column;padding-bottom:20px;}
.week-nav{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:700;color:#fff;}
.agenda-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.agenda-day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;}
.agenda-day.today{border-color:rgba(155,77,255,.5);}
.agenda-day-head{text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line);}
.agenda-day-head b{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:#fff;}
.agenda-day-head span{font-size:11px;color:var(--muted-dim);}
.agenda-day-body{flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto;padding-bottom:12px;}
.agenda-call{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:12px;}
.agenda-call .time{font-weight:800;color:var(--lime);display:block;}
.agenda-call .name{color:#fff;font-weight:700;display:block;margin-top:2px;text-decoration:none;}
.agenda-call .name:hover{text-decoration:underline;}
.agenda-empty{font-size:11.5px;color:var(--muted-dim);text-align:center;margin-top:auto;margin-bottom:auto;}
@media(max-width:900px){
  .agenda-page{height:auto;}
  .agenda-grid{grid-template-columns:1fr 1fr;grid-auto-rows:minmax(160px,auto);}
}
</style>
</head>
<body>

<div id="authGate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);">
  <span style="width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--lime);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;"></span>
  Chargement…
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<div id="adminPage" style="display:none;">

  <div class="mobile-topbar">
    <a href="index.html" class="wordmark" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
    <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="wordmark" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
      <nav class="side-nav">
        <div class="side-section-label">Coaching</div>
        <a href="index.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Mes clients
        </a>
        <a href="suivi.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Aujourd'hui
        </a>
        <a href="agenda.html" class="side-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Agenda
        </a>
        <a href="kpi.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
          KPI
        </a>
        <a href="plans.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Plans
        </a>
        <a href="audits.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 14l2 2 4-4"/></svg>
          Audits
        </a>
        <a href="messages.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Messages
        </a>
        <div class="side-section-label">Paramètres</div>
        <a href="settings.html" class="side-link">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Paramètres
        </a>
      </nav>
      <div class="side-foot">
        <div class="avatar" id="coachAvatar">–</div>
        <div class="side-foot-info">
          <b>Espace coach</b>
          <span id="coachEmail">—</span>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Déconnexion" aria-label="Déconnexion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="admin-main agenda-page">
        <div class="page-title-row" style="margin-bottom:14px;">
          <div><h1>Agenda</h1><p>Tous les calls, tous clients confondus.</p></div>
          <div class="week-nav">
            <button class="icon-btn" id="prevWeek" aria-label="Semaine précédente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="weekLabel">—</span>
            <button class="icon-btn" id="nextWeek" aria-label="Semaine suivante">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <div class="agenda-grid" id="agendaGrid"></div>
      </div>
    </main>
  </div>
</div>

<script src="../../script.js"></script>
<script src="../vendor/supabase.js"></script>
<script src="../supabase-client.js?v=15"></script>
<script src="mock-clients.js?v=3"></script>
<script>
(async function () {
  const me = await restupRequireStaff();
  if (!me) return;
  restupStaffBar(me);

  document.getElementById('authGate').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';

  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  document.getElementById('coachEmail').textContent = me.email || '—';
  if (restupIsDev(me.email)) { const devLink = document.createElement('a'); devLink.href = 'dev.html'; devLink.className = 'side-link'; devLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg> Développeur'; document.querySelector('.side-nav').appendChild(devLink); }
  document.getElementById('coachAvatar').textContent = (me.email || 'C').slice(0, 2).toUpperCase();
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = '../login.html';
  });
  const mobileToggle = document.getElementById('mobileNavToggle');
  if (mobileToggle) mobileToggle.addEventListener('click', () => document.body.classList.toggle('nav-open'));

  const [{ data: realCalls }, { data: realProfiles }] = await Promise.all([
    supabaseClient.from('calls').select('*').order('scheduled_at', { ascending: true, nullsFirst: false }),
    supabaseClient.from('profiles').select('id, company_name, email'),
  ]);

  // TEMP — calls/clients de démonstration si la base réelle est vide (voir mock-clients.js).
  const profiles = (realProfiles && realProfiles.length) ? realProfiles : (window.MOCK_CLIENTS || []);
  let calls = (realCalls && realCalls.length) ? realCalls : [];
  if (!calls.length) {
    Object.entries(window.MOCK_CALLS || {}).forEach(([user_id, list]) => {
      list.forEach(c => calls.push(Object.assign({ user_id }, c)));
    });
  }

  const profileById = {};
  profiles.forEach(p => { profileById[p.id] = p; });

  const DAY_NAMES = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

  function startOfWeek(d) {
    const date = new Date(d);
    const day = (date.getDay() + 6) % 7; // 0 = lundi
    date.setHours(0, 0, 0, 0);
    date.setDate(date.getDate() - day);
    return date;
  }

  let weekStart = startOfWeek(new Date());

  function renderWeek() {
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      days.push(d);
    }
    const today = new Date(); today.setHours(0, 0, 0, 0);

    document.getElementById('weekLabel').textContent =
      `Semaine du ${days[0].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} au ${days[6].toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}`;

    const grid = document.getElementById('agendaGrid');
    grid.innerHTML = days.map((d, i) => {
      const dayCalls = calls.filter(c => {
        if (!c.scheduled_at) return false;
        const cd = new Date(c.scheduled_at);
        return cd.toDateString() === d.toDateString();
      }).sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

      const isToday = d.getTime() === today.getTime();
      const body = dayCalls.length
        ? dayCalls.map(c => {
            const p = profileById[c.user_id];
            const name = p?.company_name || p?.email || 'Client';
            const time = new Date(c.scheduled_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            return `<div class="agenda-call">
              <span class="time">${esc(time)}</span>
              <a class="name" href="client.html?id=${esc(c.user_id)}&tab=copilot" title="Ouvrir le brief">${esc(name)}</a>
            </div>`;
          }).join('')
        : '<div class="agenda-empty">—</div>';

      return `<div class="agenda-day${isToday ? ' today' : ''}">
        <div class="agenda-day-head"><b>${DAY_NAMES[i]}</b><span>${d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span></div>
        <div class="agenda-day-body">${body}</div>
      </div>`;
    }).join('');
  }

  document.getElementById('prevWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() - 7); renderWeek();
  });
  document.getElementById('nextWeek').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() + 7); renderWeek();
  });

  renderWeek();
})();
</script>
</body>
</html>
