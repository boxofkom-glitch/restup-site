<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="../../assets/logo-restup-wordmark.png">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="RESTUP">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Client — Espace coach RESTUP</title>
<link rel="stylesheet" href="admin-theme.css">
<style>
body{overflow-x:hidden;}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(20,20,20,.92);backdrop-filter:blur(14px);z-index:20;gap:12px;flex-wrap:wrap;}
.admin-topbar .back{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;min-width:0;}
.admin-topbar .back svg{width:18px;height:18px;stroke:var(--muted);flex:0 0 auto;}
.admin-topbar .client-title{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.admin-topbar .client-email{font-size:12px;color:var(--muted-dim);}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:color .2s,border-color .2s;}
.icon-btn:hover{color:#fff;border-color:var(--muted);}
.icon-btn svg{width:16px;height:16px;}

/* ---- Sidebar shell (espace coach) ---- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:240px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;}
.sidebar .wordmark{padding:0 6px;margin-bottom:18px;}
.side-section-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-dim);padding:14px 14px 6px;}
.side-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.side-link{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-md);color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;cursor:pointer;transition:background .2s,color .2s;background:transparent;border:none;text-align:left;width:100%;font-family:inherit;}
.side-link svg{width:17px;height:17px;stroke:currentColor;flex:0 0 auto;}
.side-link:hover{background:rgba(255,255,255,.04);color:#fff;}
.side-link.active{background:var(--lime-dim);color:var(--lime);}
.side-link.soon{opacity:.5;cursor:default;}
.side-link .soon-tag{margin-left:auto;font-size:9.5px;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.06);color:var(--muted-dim);padding:2px 7px;border-radius:999px;}
.side-foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:#1c0e33;border:1px solid rgba(155,77,255,.55);color:#B37BFF;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.side-foot-info{flex:1;min-width:0;}
.side-foot-info b{display:block;font-size:13px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-foot-info span{font-size:11px;color:var(--muted-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.mobile-topbar{display:none;position:sticky;top:0;z-index:50;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(20,20,20,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.mobile-topbar .wordmark{font-size:18px;}
.mobile-nav-toggle{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-105%);transition:transform .3s ease;z-index:80;box-shadow:0 0 60px rgba(0,0,0,.5);}
  body.nav-open .sidebar{transform:translateX(0);}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;}
  .mobile-topbar{display:flex;}
}
.main{flex:1;min-width:0;}

/* ---- Client hero (avatar, badges) ---- */
.client-hero{max-width:1080px;margin:20px auto 0;padding:0 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.client-avatar{width:56px;height:56px;border-radius:16px;background:#1c0e33;border:1px solid rgba(155,77,255,.55);color:#B37BFF;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.client-hero-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;}
.badge-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:6px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
.badge-pill.on{background:var(--lime-dim);border-color:rgba(155,77,255,.3);color:var(--lime);}
.badge-pill.off{background:rgba(255,255,255,.04);color:var(--muted-dim);}
.client-hero-badges{display:flex;gap:8px;flex-wrap:wrap;}

/* ---- Chronologie ---- */
.chrono-card{max-width:1080px;margin:18px auto 0;padding:0 24px;}
.chrono-track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 20px;}
.chrono-stage{flex:1 1 0;min-width:78px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;}
.chrono-stage:not(:last-child)::after{content:"";position:absolute;top:7px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:var(--line);z-index:0;}
.chrono-stage.done:not(:last-child)::after{background:var(--lime);}
.chrono-dot{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--line);margin-bottom:10px;position:relative;z-index:1;}
.chrono-stage.done .chrono-dot{background:var(--lime);border-color:var(--lime);}
.chrono-stage.current .chrono-dot{background:#3b82f6;border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.2);}
.chrono-label{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
.chrono-stage.done .chrono-label,.chrono-stage.current .chrono-label{color:#fff;}

.tab-nav{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px 0;max-width:1080px;margin:0 auto;}
.tab-btn{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:inherit;white-space:nowrap;}
@media (max-width:760px){.tab-btn{font-size:12.5px;padding:7px 12px;}}
.tab-btn.active{background:var(--lime-dim);border-color:transparent;color:var(--lime);}

.admin-main{max-width:1080px;margin:0 auto;padding:22px 24px 80px;}
.view{display:none;}
.view.active{display:block;}
.empty-state{font-size:13.5px;color:var(--muted-dim);text-align:center;padding:34px 0;}
.section-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin-bottom:6px;}

/* ---- Général tab ---- */
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:16px;}
.info-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--muted-dim);}
.info-row span:last-child{color:#EDE4D6;font-weight:600;text-align:right;}
.info-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.notes-textarea{width:100%;min-height:220px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;color:#EDE4D6;font-family:inherit;font-size:14px;line-height:1.6;resize:vertical;}
.notes-textarea:focus{outline:none;border-color:var(--lime);}
.notes-saved-tag{font-size:11.5px;color:var(--muted-dim);margin-top:8px;display:block;}

/* ---- Activité ---- */
.activity-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);}
.activity-item:last-child{border-bottom:none;}
.activity-dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--lime);margin-top:6px;}
.activity-item.msg .activity-dot{background:#3b82f6;}
.activity-body{flex:1;min-width:0;}
.activity-date{font-size:11px;color:var(--muted-dim);text-transform:uppercase;font-weight:700;letter-spacing:.03em;margin-bottom:3px;}
.activity-text{font-size:14px;color:#EDE4D6;}

/* ---- Drive ---- */
.drive-drop{border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px;text-align:center;margin-bottom:18px;}
.drive-drop input{margin-top:12px;}
.drive-file-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
.drive-file-row:last-child{border-bottom:none;}
.drive-file-row a{color:var(--lime);text-decoration:none;font-weight:700;}
.paid-tag{font-size:11px;font-weight:800;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.paid-tag.yes{background:var(--lime-dim);color:var(--lime);}
.paid-tag.no{background:rgba(255,80,80,.12);color:#ff8a8a;}
.btn-danger{background:transparent;border:1px solid rgba(255,80,80,.4);color:#ff8a8a;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit;}
.btn-danger:hover{background:rgba(255,60,60,.1);}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);color:#fff;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:999px;cursor:pointer;text-decoration:none;}
.btn-secondary:hover{border-color:var(--muted);}

/* ---- Parcours tab (mirrors client dashboard) ---- */
.parcours-step{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid var(--line);}
.parcours-step:last-child{border-bottom:none;}
.parcours-icon{width:42px;height:42px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.parcours-icon svg{width:19px;height:19px;stroke:var(--muted);}
.parcours-step.pdone .parcours-icon{border-color:var(--lime);}
.parcours-step.pdone .parcours-icon svg{stroke:var(--lime);}
.parcours-step.ptodo .parcours-icon{border-color:#ffc94d;}
.parcours-step.ptodo .parcours-icon svg{stroke:#ffc94d;}
.parcours-body{flex:1;min-width:0;}
.parcours-title{font-size:14.5px;font-weight:800;color:#fff;}
.parcours-sub{font-size:12px;color:var(--muted-dim);margin-top:2px;}
.parcours-badge{flex:0 0 auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:5px 12px;border-radius:999px;white-space:nowrap;}
.parcours-badge.pdone{background:var(--lime-dim);color:var(--lime);}
.parcours-badge.ptodo{background:rgba(255,190,60,.12);color:#ffc94d;}
.parcours-badge.plocked{background:rgba(255,255,255,.05);color:var(--muted-dim);}

/* ---- cross-links + detailed action table ---- */
.doc-jump{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--lime);background:var(--lime-dim);border:1px solid rgba(155,77,255,.3);border-radius:999px;padding:8px 14px;cursor:pointer;margin-bottom:18px;text-decoration:none;}
.doc-jump:hover{filter:brightness(1.1);}
.table-scroll{overflow-x:auto;overflow-y:hidden;}
.action-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.action-table th{text-align:left;padding:10px 12px;color:var(--muted-dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);}
.action-table td{padding:11px 12px;border-bottom:1px solid var(--line);color:#EDE4D6;}
.action-table tr:last-child td{border-bottom:none;}
.action-status{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.action-status.adone{background:var(--lime-dim);color:var(--lime);}
.action-status.atodo{background:rgba(255,255,255,.06);color:var(--muted-dim);}

/* ---- Audit tab ---- */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
@media (max-width:640px){.stat-grid{grid-template-columns:1fr 1fr;}}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 14px;}
.stat-card span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-dim);display:block;margin-bottom:8px;}
.stat-card b{font-size:21px;font-weight:900;color:#fff;}
.journey-mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;}
.journey-mini h5{font-size:12px;color:var(--muted-dim);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.journey-mini p{font-size:14px;color:#EDE4D6;line-height:1.6;}
.raw-toggle{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;margin-top:6px;}
.raw-json{width:100%;min-height:260px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;color:#EDE4D6;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;margin-top:12px;white-space:pre;}
.raw-json:focus{outline:none;border-color:var(--lime);}

/* ---- Plan editor ---- */
.plan-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:20px;}
.plan-block h4{font-size:15px;color:#fff;margin-bottom:14px;}
.repeat-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.repeat-row input,.repeat-row textarea{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;color:#fff;font-family:inherit;font-size:13.5px;}
.repeat-row input:focus,.repeat-row textarea:focus{outline:none;border-color:var(--lime);}
.chip-remove{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.chip-remove:hover{color:#ff8a8a;border-color:#ff8a8a;}
.add-row-btn{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:var(--r-sm);cursor:pointer;width:100%;text-align:center;margin-top:4px;}
.add-row-btn:hover{color:var(--lime);border-color:var(--lime);}
.inline-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
.inline-check input{accent-color:#22C55E;width:16px;height:16px;}
.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.quick-actions button{background:var(--surface);border:1px solid var(--line);color:#fff;font-size:13px;font-weight:700;padding:11px 16px;border-radius:999px;cursor:pointer;}
.quick-actions button:hover{border-color:var(--lime);color:var(--lime);}

.axis-card{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px;}
.axis-card:last-of-type{margin-bottom:0;}
.axis-card-head{display:flex;justify-content:flex-end;margin-bottom:8px;}
.cycle-card{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px;background:var(--ink);}
.cycle-card:last-child{margin-bottom:0;}
.cycle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.cycle-head h5{font-size:14.5px;color:#fff;}
.month-card{border-left:2px solid var(--lime-dim);padding-left:16px;margin-bottom:16px;margin-top:10px;}
.month-card:last-child{margin-bottom:0;}
.month-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.week-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;}
.week-card:last-child{margin-bottom:0;}
.week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;}
.week-head input[type="text"]{background:transparent;border:none;color:#fff;font-weight:700;font-size:13.5px;padding:2px 0;flex:1;}
.week-head input[type="text"]:focus{outline:none;}
.save-bar{position:sticky;bottom:0;background:rgba(20,20,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:14px 0;margin-top:10px;display:flex;justify-content:flex-end;}

/* ---- Messages ---- */
.msg-list{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;margin-bottom:14px;padding-right:2px;padding-bottom:8px;}
.msg-item{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;max-width:78%;align-self:flex-start;}
.msg-item.mine{background:var(--lime-dim);border-color:rgba(155,77,255,.25);align-self:flex-end;}
.msg-item b{color:var(--lime);font-size:11px;display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em;}
.msg-item.mine b{color:#fff;}

/* ---- Calls ---- */
.call-row{border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px;background:var(--ink);}
.call-row:last-child{margin-bottom:0;}
.call-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.call-row select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:#fff;font-family:inherit;font-size:13px;}

/* Mobile : dossier compact (l'en-tête ne mange plus l'écran), onglets sur une seule ligne */
@media (max-width:900px){
  .main{display:block !important;overflow-y:auto !important;-webkit-overflow-scrolling:touch}
  .main>.admin-main{overflow:visible !important;flex:none !important;padding:10px 14px calc(70px + env(safe-area-inset-bottom,0px)) !important}
  .admin-topbar{padding:6px 14px !important;min-height:0 !important}
  .admin-topbar .client-email,.admin-topbar #logoutBtn{display:none !important}
  .client-hero{padding:8px 14px !important;gap:8px !important;flex-wrap:wrap !important;margin:0 !important}
  .client-hero .client-avatar{width:42px !important;height:42px !important;font-size:15px !important;border-radius:12px !important}
  .client-hero-name{font-size:18px !important}
  .client-hero .btn-primary,.client-hero .btn-secondary{min-height:38px !important;padding:0 14px !important;font-size:12.5px !important}
  .chrono-card{display:none !important}
  .tab-nav{position:sticky;top:calc(50px + env(safe-area-inset-top,0px));z-index:40;background:#0B0D0C;flex-wrap:nowrap !important;overflow-x:auto;padding:8px 14px !important;margin:0 !important;gap:8px;scrollbar-width:none}
  .tab-nav::-webkit-scrollbar{display:none}
  .tab-nav .tab-btn{flex:0 0 auto;white-space:nowrap}
}
</style>
</head>
<body>

<div id="authGate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);">
  <span style="width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--lime);border-radius:50%;display:inline-block;animation:spin .7s linear infinite;"></span>
  Chargement…
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<div id="adminPage" style="display:none;">

  <div class="mobile-topbar">
    <a href="index.html" class="wordmark" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
    <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="wordmark" aria-label="RESTUP, accueil">REST<span class="up">UP</span></a>
      <nav class="side-nav">
        <div class="side-section-label">Coaching</div>
        <a href="index.html" class="side-link active">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Mes clients

<script src="../supabase-client.js?v=15"></script>

<script src="mock-clients.js?v=3"></script>
<script>
(async function () {
  const params = new URLSearchParams(window.location.search);
  const clientId = params.get('id');

  const me = await restupRequireStaff();
  if (!me) return;
  restupStaffBar(me);
  if (!clientId) { window.location.href = 'index.html'; return; }

  document.getElementById('authGate').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';

  const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // TEMP — repli localStorage pour les clients de démo (id non-UUID) que Supabase refuse en écriture.
  // Voir aussi portail/dashboard.html, portail/admin/audits.html, portail/admin/plans.html.
  function localSave(table, userId, data) {
    const key = 'restup_local_' + table;
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    all[userId] = data;
    localStorage.setItem(key, JSON.stringify(all));
  }
  function localLoad(table, userId) {
    const all = JSON.parse(localStorage.getItem('restup_local_' + table) || '{}');
    return all[userId] || null;
  }
  const isUuid = (s) => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s || '');
  // Le repli local ne sert qu'aux clients de démo (id non-UUID, en local). Sinon l'erreur remonte.
  async function upsertWithFallback(table, userId, data) {
    const { error } = await supabaseClient.from(table).upsert({ user_id: userId, data }, { onConflict: 'user_id' });
    if (error) {
      if (!isUuid(userId) && IS_LOCAL) { localSave(table, userId, data); return { error: null }; }
      if (window.toast) toast('Enregistrement impossible : ' + error.message, 'error');
      return { error };
    }
    return { error: null };
  }
  const fmtEuro = (n) => n == null ? '—' : Number(n).toLocaleString('fr-FR') + ' €';

  async function doLogout() {
    await supabaseClient.auth.signOut();
    window.location.href = '../login.html';
  }
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('sidebarLogoutBtn').addEventListener('click', doLogout);
  document.getElementById('coachEmail').textContent = me.email || '—';
  if (restupIsDev(me.email)) { const devLink = document.createElement('a'); devLink.href = 'dev.html'; devLink.className = 'side-link'; devLink.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg> Développeur'; document.querySelector('.side-nav').appendChild(devLink); }
  document.getElementById('coachAvatar').textContent = (me.email || 'C').slice(0, 2).toUpperCase();
  const mobileToggle = document.getElementById('mobileNavToggle');
  if (mobileToggle) mobileToggle.addEventListener('click', () => document.body.classList.toggle('nav-open'));

  // ---- Tabs ----
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    window.scrollTo({ top: 0, behavior: 'smooth' }); const am = document.querySelector('.main > .admin-main'); if (am) am.scrollTo({ top: 0 });
    if (name === 'copilot' && !window.__cpMounted && window.restupCopilot && window.__cpCtx) { window.__cpMounted = true; window.restupCopilot(window.__cpCtx); }
  }
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ---- Profile header ----
  const { data: profileRow } = await supabaseClient.from('profiles').select('*').eq('id', clientId).maybeSingle();
  // TEMP — bascule sur un client de démonstration si l'id ne correspond à aucune ligne réelle.
  const profile = profileRow || (window.MOCK_CLIENTS || []).find(c => c.id === clientId) || null;
  let displayName = profile?.company_name || '(sans nom)';
  document.getElementById('clientTitle').textContent = displayName;
  document.getElementById('clientEmail').textContent = profile?.email || '';
  document.getElementById('clientHeroName').textContent = displayName;
  document.getElementById('clientAvatar').textContent = displayName.trim().slice(0, 2).toUpperCase();

  const badgesWrap = document.getElementById('clientBadges');
  const badges = [];
  badges.push(profile?.active === false
    ? '<span class="badge-pill off">Inactif</span>'
    : '<span class="badge-pill on">Actif</span>');
  if (profile?.created_at) {
    const days = Math.max(0, Math.floor((Date.now() - new Date(profile.created_at).getTime()) / 86400000));
    badges.push(`<span class="badge-pill">${days} jours</span>`);
  }
  badgesWrap.innerHTML = badges.join('');

  // =========================================================
  // PARCOURS D'ACCUEIL : assignation · audit programmé · résumé onboarding · timeline
  // =========================================================
  async function logEvent(type, payload) {
    if (!isUuid(clientId)) return;
    try { await supabaseClient.from('events').insert({ client_id: clientId, type, actor_id: me.id, payload: payload || {} }); } catch (e) { /* ne bloque jamais l'action */ }
  }
  window.__cpCtx = { sb: supabaseClient, clientId, profile, me, root: document.getElementById('copilotRoot'), esc, toast: (m, t) => window.toast && window.toast(m, t), logEvent, isUuid };
  const isDevUser = restupIsDev(me.email);
  let teamCoaches = [];
  async function loadCoaches() {
    try { const { data } = await supabaseClient.from('team_members').select('id, name, email').eq('role', 'coach'); teamCoaches = data || []; } catch (e) {}
  }
  const ONB_LABEL = { not_started: 'À faire', in_progress: 'En cours', completed: 'Terminé' };
  const fmtN = (n) => (n == null || n === '') ? '—' : Number(n).toLocaleString('fr-FR');

  function onboardingSummaryHtml() {
    const o = profile && profile.onboarding;
    if (!o || !(o.answers || o.f)) return '<div class="empty-state" style="padding:14px 0;">Le client n\'a pas encore renseigné son onboarding.</div>';
    const rows = [];
    if (o.v === 2 && o.answers) {
      const x = o.answers, list = (v) => Array.isArray(v) ? v.join(', ') : v;
      const add = (k, v) => { if (v !== undefined && v !== null && v !== '') rows.push([k, list(v)]); };
      add('Établissement', [x.company, x.kind, x.city].filter(Boolean).join(' · '));
      add('Ouvert depuis', x.age); add('Rôle', x.role); add('Équipe', x.team); add('Heures / semaine', x.hours);
      add('Situation (1-5)', x.situation); add('Énergie du dirigeant (1-5)', x.energy);
      add('Pourquoi maintenant', x.why_now); add('Sujets qui pèsent', x.themes); add('Difficulté principale', x.problem);
      add('Depuis', x.since); add('Déjà tenté', x.tried); add('Résultat', x.tried_result);
      add('Objectif 4 mois', x.goal_4m); add('Objectif 12 mois', x.goal_12m); add('Critère de réussite', x.success);
      add('CA mensuel (approx.)', x.revenue_month ? fmtN(x.revenue_month) + ' €' : ''); add('Marge ressentie', x.margin_feel); add('Suivi des chiffres', x.tracks);
      add('Ticket moyen', x.avg_ticket ? fmtN(x.avg_ticket) + ' €' : ''); add('Couverts / semaine', x.covers_week ? fmtN(x.covers_week) : '');
      add('Coût matière', x.food_cost ? x.food_cost + ' %' : ''); add('Masse salariale', x.payroll ? x.payroll + ' %' : '');
      add('Responsable en salle / cuisine', x.manager); add('Part livraison', x.delivery);
      add('Préférence de contact', [x.channel, x.best_time].filter(Boolean).join(' · ')); add('Contrainte', x.constraints);
      if (o.completeness != null) rows.unshift(['Complétude du dossier', o.completeness + ' %' + ((o.missing || []).length ? ' — manque : ' + o.missing.join(' ; ') : ' — complet')]);
    } else if (o.f) {
      const f = o.f;
      rows.push(['Établissement', [f.type, f.seats ? f.seats + ' couverts' : ''].filter(Boolean).join(' · ')], ['CA annuel', f.revenue ? fmtN(f.revenue) + ' €' : '—'], ['Objectif 4 mois', f.obj4m || '—'], ['Blocage déclaré', f.blocker || '—'], ['Vision 12 mois', f.vision || '—']);
    }
    return rows.map(r => `<div class="info-row"><span>${esc(r[0])}</span><span style="max-width:62%;text-align:right;white-space:pre-wrap;">${esc(r[1])}</span></div>`).join('');
  }
  function startCardHtml() {
    const ob = (profile && profile.onboarding_status) || 'completed';
    const coach = teamCoaches.find(t => t.id === (profile && profile.coach_id));
    const coachCell = isDevUser
      ? `<select id="assignCoach" style="background:var(--ink);border:1px solid var(--line);color:#fff;border-radius:var(--r-sm);padding:8px 10px;font-family:inherit;"><option value="">— Non assigné —</option>${teamCoaches.map(t => `<option value="${esc(t.id)}"${t.id === (profile && profile.coach_id) ? ' selected' : ''}>${esc(t.name || t.email)}</option>`).join('')}</select>`
      : esc(coach ? (coach.name || coach.email) : '—');
    const at = profile && profile.audit_scheduled_at;
    return `
      <div class="info-card" id="startCard">
        <div class="info-card-head"><span class="section-tag" style="margin-bottom:0;">Démarrage</span><span class="paid-tag ${ob === 'completed' ? 'yes' : 'no'}">Onboarding : ${esc(ONB_LABEL[ob] || ob)}</span></div>
        <div class="info-row"><span>Coach</span><span>${coachCell}</span></div>
        <div class="info-row"><span>Audit programmé</span><span>${at ? esc(new Date(at).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })) : '<em style="color:var(--muted-dim);">Non programmé</em>'}</span></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;">
          <input type="datetime-local" id="auditWhen" value="${at ? esc(toLocalInputValue(at)) : ''}" style="background:var(--ink);border:1px solid var(--line);color:#fff;border-radius:var(--r-sm);padding:9px 12px;font-family:inherit;">
          <button type="button" class="btn-secondary" id="scheduleAuditBtn" style="padding:9px 16px;">${at ? 'Modifier le rendez-vous' : 'Programmer l\'audit'}</button>
          <button type="button" class="btn-primary magnetic" id="openModeAudit" style="padding:9px 18px;">🎯 Ouvrir le Mode Audit</button>
        </div>
        <a id="auditWaConfirm" class="doc-jump" href="#" target="_blank" rel="noopener" style="display:none;margin-top:10px;">👋 Confirmer le rendez-vous par WhatsApp →</a>
      </div>
      <div class="info-card">
        <div class="info-card-head"><span class="section-tag" style="margin-bottom:0;">Ce que le client a renseigné</span></div>
        ${onboardingSummaryHtml()}
      </div>
      <div class="info-card" id="timelineCard">
        <div class="info-card-head"><span class="section-tag" style="margin-bottom:0;">Historique</span></div>
        <div id="timelineList"><div class="empty-state" style="padding:14px 0;">Chargement…</div></div>
      </div>`;
  }

  const EVENT_LABEL = {
    'account.activated': 'Compte activé', 'onboarding.completed': 'Onboarding terminé', 'coach.assigned': 'Coach assigné',
    'audit.scheduled': 'Audit programmé', 'audit.draft_created': 'Brouillon d\'audit créé', 'audit.published': 'Audit validé et publié',
    'audit.unpublished': 'Audit repassé en brouillon', 'quickwin.selected': 'Première priorité (Quick Win) choisie', 'plan.draft_created': 'Brouillon de plan créé', 'payment.updated': 'Paiement mis à jour',
  };
  async function renderTimeline() {
    const wrap = document.getElementById('timelineList');
    if (!wrap) return;
    if (!isUuid(clientId)) { wrap.innerHTML = '<div class="empty-state" style="padding:14px 0;">Pas d\'historique pour un client de démonstration.</div>'; return; }
    const { data } = await supabaseClient.from('events').select('*').eq('client_id', clientId).order('created_at', { ascending: false }).limit(30);
    if (!data || !data.length) { wrap.innerHTML = '<div class="empty-state" style="padding:14px 0;">Aucun événement pour l\'instant.</div>'; return; }
    wrap.innerHTML = data.map(e => `<div class="info-row"><span>${esc(EVENT_LABEL[e.type] || e.type)}</span><span>${esc(new Date(e.created_at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))}</span></div>`).join('');
  }

  function mountStartCard() {
    const sel = document.getElementById('assignCoach');
    if (sel) sel.addEventListener('change', async () => {
      const { error } = await supabaseClient.from('profiles').update({ coach_id: sel.value || null }).eq('id', clientId);
      if (error) { if (window.toast) toast(error.message, 'error'); return; }
      profile.coach_id = sel.value || null;
      await logEvent('coach.assigned', { coach_id: sel.value || null });
      if (window.toast) toast('Coach mis à jour', 'ok');
      renderTimeline();
    });
    document.getElementById('openModeAudit').addEventListener('click', () => switchTab('audit'));
    let scheduling = false;
    document.getElementById('scheduleAuditBtn').addEventListener('click', async () => {
      if (scheduling) return;
      const v = document.getElementById('auditWhen').value;
      if (!v) { if (window.toast) toast('Choisis une date et une heure.', 'error'); return; }
      scheduling = true;
      const iso = new Date(v).toISOString();
      const { error } = await supabaseClient.from('profiles').update({ audit_scheduled_at: iso }).eq('id', clientId);
      if (error) { scheduling = false; if (window.toast) toast(error.message, 'error'); return; }
      const { data: existing } = await supabaseClient.from('calls').select('id').eq('user_id', clientId).eq('kind', 'audit').maybeSingle();
      if (existing) await supabaseClient.from('calls').update({ scheduled_at: iso, status: 'confirmed' }).eq('id', existing.id);
      else await supabaseClient.from('calls').insert({ user_id: clientId, kind: 'audit', status: 'confirmed', scheduled_at: iso, notes: 'Audit' });
      profile.audit_scheduled_at = iso;
      await logEvent('audit.scheduled', { at: iso });
      scheduling = false;
      if (window.toast) toast('Audit programmé — visible dans l\'espace du client', 'ok');
      renderGeneral();
      const when = new Date(iso).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
      const wa = (profile.phone || '').replace(/[^\d]/g, '').replace(/^0/, '33');
      const link = document.getElementById('auditWaConfirm');
      if (wa && link) { link.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Bonjour ' + (profile.first_name || '') + ' 👋 Ton audit RestUp est confirmé : ' + when + '. À très vite !'); link.style.display = 'inline-block'; }
    });
    renderTimeline();
  }

  // =========================================================
  // MODE AUDIT : notes/transcription (autosave) → brouillon → correction → validation → Quick Win
  // =========================================================
  const notesKey = 'restup_audit_notes_' + clientId;
  function buildAuditDraft(notes) {
    const o = profile && profile.onboarding, x = (o && o.v === 2 && o.answers) ? o.answers : null;
    let d;
    if (o && o.f && window.restupBuildDraft) { try { d = JSON.parse(JSON.stringify(window.restupBuildDraft(o).audit)); } catch (e) { d = null; } }
    if (!d) {
      d = {
        overview: { revenue: x && x.revenue_month ? x.revenue_month * 12 : null, margin_pct: null, employees: null, fixed_costs: null, avg_sale: null, cash: null },
        growth_journey: { vision_12m: x ? (x.goal_12m || '') : '', objective_4m: x ? (x.goal_4m || '') : '', blocker: x ? (x.problem || '') : '' },
      };
      if (x) d.onboarding_context = { themes: x.themes || [], since: x.since || '', situation: x.situation || null, energy: x.energy || null, why_now: x.why_now || '' };
    }
    d.status = 'draft';
    d.version = 1;
    d.audit_notes = notes || '';
    if (notes) d.source_prompt = notes;
    d.generation = { method: (o ? 'onboarding' : 'manual') + (notes ? '+notes' : ''), generated_at: new Date().toISOString(), human_validated: false };
    return d;
  }
  function modeAuditStartHtml() {
    const hasOnb = !!(profile && profile.onboarding && (profile.onboarding.answers || profile.onboarding.f));
    const saved = (() => { try { return localStorage.getItem(notesKey) || ''; } catch (e) { return ''; } })();
    return `
      <div class="info-card">
        <div class="info-card-head"><span class="section-tag" style="margin-bottom:0;">Mode Audit</span></div>
        <p style="font-size:13.5px;color:var(--muted);margin-bottom:12px;">Prends tes notes (ou colle la transcription) pendant l'appel. Tout est sauvegardé automatiquement. Ensuite, génère un brouillon : tu le corriges, puis tu le valides.</p>
        <textarea id="auditNotes" rows="10" placeholder="Notes / transcription du call d'audit…" style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;color:#fff;font-family:inherit;font-size:14px;">${esc(saved)}</textarea>
        <div id="auditNotesState" style="font-size:12px;color:var(--muted-dim);margin:6px 0 12px;">${saved ? 'Notes récupérées.' : ''}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="button" class="btn-primary magnetic" id="genAuditBtn" style="padding:10px 18px;">⚡ Générer le brouillon d'audit</button>
          <button type="button" class="btn-secondary" id="blankAuditBtn" style="padding:10px 18px;">Commencer sans génération</button>
        </div>
        <p style="font-size:12px;color:var(--muted-dim);margin-top:10px;">${hasOnb ? 'Le brouillon reprend ce que le client a dit dans son onboarding (objectifs, difficulté). Les chiffres se précisent pendant l\'audit.' : 'Le client n\'a pas encore terminé son onboarding : le brouillon sera vide, à compléter.'} La génération ne dépend d'aucun service externe : elle fonctionne toujours.</p>
      </div>`;
  }

  function mountModeAuditStart() {
    const ta = document.getElementById('auditNotes');
    let t = null;
    ta.addEventListener('input', () => {
      document.getElementById('auditNotesState').textContent = 'Enregistrement…';
      clearTimeout(t);
      t = setTimeout(() => { try { localStorage.setItem(notesKey, ta.value); } catch (e) {} document.getElementById('auditNotesState').textContent = 'Enregistré ✔'; }, 500);
    });
    let creating = false;
    const create = async (withNotes) => {
      if (creating) return; creating = true;
      const d = buildAuditDraft(withNotes ? ta.value.trim() : '');
      const { error } = await upsertWithFallback('audits', clientId, d);
      creating = false;
      if (error) return;
      await logEvent('audit.draft_created', { method: d.generation.method });
      try { localStorage.removeItem(notesKey); } catch (e) {}
      if (window.toast) toast('Brouillon d\'audit créé — à corriger puis valider', 'ok');
      await loadAudit(); renderAuditTab();
    };
    document.getElementById('genAuditBtn').addEventListener('click', () => create(true));
    document.getElementById('blankAuditBtn').addEventListener('click', () => create(false));
  }

  // ---- Quick Win : une seule Première priorité pour le client ----
  function quickWinSuggestion(a) {
    let action = '', problem = '';
    try {
      const pillars = a.pillars || [];
      const all = pillars.flatMap(p => p.criteria || []);
      const weak = all.sort((x, y) => x.pct - y.pct)[0];
      if (weak) problem = weak.label + ' — ' + weak.status;
      if (profile && profile.onboarding && window.restupBuildDraft) {
        const plan = window.restupBuildDraft(profile.onboarding).plan;
        const t = plan.cycles[0].months[0].weeks[0].tasks[0];
        if (t) action = t.text;
      }
    } catch (e) {}
    const ob = profile && profile.onboarding;
    if (!problem && ob && ob.v === 2 && ob.answers) problem = ob.answers.problem || '';
    return { problem, action };
  }
  function quickWinHtml(a) {
    const qw = a.quick_win || null;
    const sug = quickWinSuggestion(a);
    const v = (k) => esc(qw ? (qw[k] || '') : (sug[k] || ''));
    return `
      <div class="info-card" id="quickWinCard">
        <div class="info-card-head"><span class="section-tag" style="margin-bottom:0;">Quick Win — première priorité du client</span>${qw && qw.selected_at ? '<span class="paid-tag yes">Choisi</span>' : '<span class="paid-tag no">À choisir</span>'}</div>
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">Une seule action claire, concrète et mesurable. Le client ne verra que celle-ci en priorité. ${qw ? '' : 'Proposition pré-remplie : modifie-la librement.'}</p>
        <div class="field"><label>Problème (issu de l'audit)</label><input type="text" id="qwProblem" value="${v('problem')}"></div>
        <div class="field"><label>Action (une seule, exécutable)</label><input type="text" id="qwAction" value="${v('action')}"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
          <div class="field"><label>Effort</label><select id="qwEffort" style="width:100%;background:var(--ink);border:1px solid var(--line);color:#fff;border-radius:var(--r-sm);padding:10px;">${['S', 'M', 'L'].map(x => `<option${qw && qw.effort === x ? ' selected' : ''}>${x}</option>`).join('')}</select></div>
          <div class="field"><label>Délai</label><input type="text" id="qwDelay" placeholder="72 h" value="${esc(qw ? (qw.delay || '') : '72 h')}"></div>
          <div class="field"><label>Preuve attendue</label><input type="text" id="qwProof" placeholder="KPI / document" value="${esc(qw ? (qw.proof || '') : '')}"></div>
        </div>
        <div class="field"><label>Impact attendu</label><select id="qwImpact" style="width:100%;background:var(--ink);border:1px solid var(--line);color:#fff;border-radius:var(--r-sm);padding:10px;">${[['1', 'Faible'], ['2', 'Moyen'], ['3', 'Fort']].map(([x, l]) => `<option value="${x}"${(qw && String(qw.impact) === x) || (!qw && x === '2') ? ' selected' : ''}>${l}</option>`).join('')}</select><div class="hint" id="qwScore" style="margin-top:6px;"></div></div>
        <button type="button" class="btn-primary magnetic" id="selectQuickWin" style="padding:10px 18px;">${qw && qw.selected_at ? 'Mettre à jour la première priorité' : 'Choisir comme première priorité'}</button>
        <p style="font-size:12px;color:var(--muted-dim);margin-top:8px;">Le client la voit dès que l'audit est publié.</p>
        ${qw && qw.selected_at ? `
        <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px;">
          <span class="section-tag" style="margin-bottom:8px;">Première victoire — avant / après</span>
          ${qw.won_at ? `<p style="font-size:13.5px;color:#B37BFF;font-weight:700;margin-bottom:6px;">Victoire documentée le ${new Date(qw.won_at).toLocaleDateString('fr-FR')} — Time-to-First-Win : ${qw.ttfw_days != null ? qw.ttfw_days + ' jour' + (qw.ttfw_days > 1 ? 's' : '') : '—'}</p>` : `<p style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Quand le client a fait l'action, note la preuve : un chiffre, ou une observation concrète.</p>`}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div class="field"><label>Avant</label><input type="text" id="qwBefore" value="${esc(qw.before || '')}" placeholder="Ex. 340 € de pertes / semaine"></div>
            <div class="field"><label>Après</label><input type="text" id="qwAfter" value="${esc(qw.after || '')}" placeholder="Ex. 210 € de pertes / semaine"></div>
          </div>
          <button type="button" class="btn-primary magnetic" id="saveQuickWinResult" style="padding:10px 18px;">${qw.won_at ? 'Mettre à jour la victoire' : 'Enregistrer la première victoire'}</button>
        </div>` : ''}
      </div>`;
  }
  function mountQuickWin(a) {
    let saving = false;
    const upScore = () => {
      const e = { S: 1, M: 2, L: 3 }[document.getElementById('qwEffort').value] || 2, i = Number(document.getElementById('qwImpact').value) || 2;
      const s = Math.round((i / e) * 10) / 10;
      document.getElementById('qwScore').textContent = 'Score priorité : ' + s + (s >= 2 ? ' — excellent (impact fort, effort faible)' : s >= 1 ? ' — bon candidat' : ' — à challenger');
    };
    ['qwEffort', 'qwImpact'].forEach((id) => document.getElementById(id).addEventListener('change', upScore)); upScore();
    const winBtn = document.getElementById('saveQuickWinResult');
    if (winBtn) winBtn.addEventListener('click', async () => {
      const before = document.getElementById('qwBefore').value.trim(), after = document.getElementById('qwAfter').value.trim();
      if (!before && !after) { if (window.toast) toast('Renseigne au moins un avant ou un après.', 'error'); return; }
      const qw0 = a.quick_win || {};
      const start = profile && profile.created_at ? new Date(profile.created_at).getTime() : Date.parse(qw0.selected_at);
      const won_at = qw0.won_at || new Date().toISOString();
      const ttfw_days = Math.max(0, Math.round((Date.parse(won_at) - start) / 86400000));
      const { error } = await upsertWithFallback('audits', clientId, { ...a, quick_win: { ...qw0, before, after, won_at, ttfw_days, result: after ? (before ? before + ' → ' + after : after) : before } });
      if (error) return;
      await logEvent('quickwin.won', { before, after, ttfw_days });
      if (window.toast) toast('Première victoire enregistrée', 'ok');
      await loadAudit(); renderAuditTab();
    });
    document.getElementById('selectQuickWin').addEventListener('click', async () => {
      if (saving) return;
      const action = document.getElementById('qwAction').value.trim();
      if (!action) { if (window.toast) toast('Décris l\'action à mener.', 'error'); return; }
      saving = true;
      const qw = {
        problem: document.getElementById('qwProblem').value.trim(), action,
        effort: document.getElementById('qwEffort').value, impact: Number(document.getElementById('qwImpact').value), delay: document.getElementById('qwDelay').value.trim(),
        proof: document.getElementById('qwProof').value.trim(), selected_at: new Date().toISOString(), selected_by: me.id, decision: 'selected',
      };
      const { error } = await upsertWithFallback('audits', clientId, { ...a, quick_win: qw });
      saving = false;
      if (error) return;
      await logEvent('quickwin.selected', { action });
      if (window.toast) toast('Première priorité enregistrée', 'ok');
      await loadAudit(); renderAuditTab();
    });
  }

  // =========================================================

  let auditRow = null;
  async function loadAudit() {
    const { data } = await supabaseClient.from('audits').select('*').eq('user_id', clientId).maybeSingle();
    // TEMP — bascule sur un brouillon local puis sur l'audit de démonstration si aucune ligne réelle n'existe.
    const localAudit = isUuid(clientId) ? null : localLoad('audits', clientId);
    const mockAudit = isUuid(clientId) ? null : (window.MOCK_AUDITS || {})[clientId];
    auditRow = data || (localAudit ? { user_id: clientId, data: localAudit } : null) || (mockAudit ? { user_id: clientId, data: mockAudit } : null);
  }

  function renderAuditTab() {
    const root = document.getElementById('auditRoot');
    if (!auditRow) {
      root.innerHTML = modeAuditStartHtml();
      mountModeAuditStart();
      return;
    }
    const a = auditRow.data || {};
    const ov = a.overview || {};
    const gj = a.growth_journey || {};
    const isDraft = a.status === 'draft';
    root.innerHTML = `
      <div class="status-row">
        <span class="paid-tag ${isDraft ? 'no' : 'yes'}">${isDraft ? 'Brouillon — non visible par le client' : 'Publié — visible par le client'}</span>
        <button type="button" class="btn-primary magnetic" id="togglePublishAudit" style="padding:9px 18px;">${isDraft ? 'Publier au client' : 'Repasser en brouillon'}</button>

      </div>

        <button type="button" class="doc-jump" id="jumpToPlan">Voir le plan d'action →</button>

      ${quickWinHtml(a)}
      ${a.source_prompt ? `<div class="journey-mini" style="border-color:rgba(155,77,255,.3);"><h5>📝 Notes / transcription utilisées pour générer ce brouillon</h5><p style="white-space:pre-wrap;">${esc(a.source_prompt)}</p></div>` : ''}

        <div class="stat-card"><span>Marge nette</span><b>${ov.margin_pct ?? '—'}%</b></div>
        <div class="stat-card"><span>Collaborateurs</span><b>${ov.employees ?? '—'}</b></div>
        <div class="stat-card"><span>Charges fixes</span><b>${fmtEuro(ov.fixed_costs)}</b></div>
        <div class="stat-card"><span>Vente moyenne</span><b>${fmtEuro(ov.avg_sale)}</b></div>
        <div class="stat-card"><span>Trésorerie</span><b>${fmtEuro(ov.cash)}</b></div>
      </div>
      ${gj.vision_12m ? `<div class="journey-mini"><h5>Vision à 12 mois (dite par le client)</h5><p>${esc(gj.vision_12m)}</p></div>` : ''}
      ${gj.objective_4m ? `<div class="journey-mini"><h5>Objectif à 4 mois</h5><p>${esc(gj.objective_4m)}</p></div>` : ''}
      ${gj.blocker ? `<div class="journey-mini"><h5>Blocage identifié</h5><p>${esc(gj.blocker)}</p></div>` : ''}

      <div id="rawAuditWrap" style="display:none;">

      </div>
    `;
    mountQuickWin(a);
    document.getElementById('jumpToPlan').addEventListener('click', () => switchTab('plan'));
    document.getElementById('genPlanFromAudit').addEventListener('click', async () => {
      if (planData && !confirm('Un plan existe déjà pour ce client. Le remplacer par un brouillon généré depuis l\'audit ?')) return;
      planData = generatePlanFromAudit(a);
      await savePlan(true);

      switchTab('plan');
      renderPlanEditor();
    });
    document.getElementById('togglePublishAudit').addEventListener('click', async () => {
      if (isDraft && !(a.quick_win && a.quick_win.action) && !confirm('Aucune première priorité (Quick Win) n\'est choisie : le client ne verra pas de priorité. Publier quand même ?')) return;
      const next = { ...a, status: isDraft ? 'published' : 'draft' };
      if (isDraft) { next.generation = { ...(a.generation || {}), human_validated: true, validated_at: new Date().toISOString(), validated_by: me.id }; next.version = (a.version || 1) + 1; }

      auditRow = null;
      await loadAudit();
      renderAuditTab();
    });

      const wrap = document.getElementById('rawAuditWrap');
      wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';

      let parsed;
      try { parsed = JSON.parse(document.getElementById('rawAuditText').value); }

  // =========================================================
  // Récap concis de la semaine en cours + tâches en retard des semaines précédentes (pas de liste détaillée).
  function renderWaRecap() {
    const btn = document.getElementById('waRecapBtn');
    const welcomeBtn = document.getElementById('waWelcomeBtn');
    const waNumber = (profile?.phone || '').replace(/[^\d]/g, '');
    if (!waNumber) { btn.style.display = 'none'; welcomeBtn.style.display = 'none'; return; }
    const welcomeMsg = `Bonjour ${displayName} 👋 Ici votre coach RestUp !\n\nRavi de démarrer l'accompagnement avec vous. On va commencer par un audit complet de votre établissement pour cadrer les priorités, puis construire ensemble votre plan d'action semaine par semaine.\n\nJe reviens vite vers vous pour caler le premier rendez-vous. À très vite !\n— votre coach RestUp`;
    welcomeBtn.href = `https://wa.me/${waNumber}?text=${encodeURIComponent(welcomeMsg)}`;
    welcomeBtn.style.display = 'inline-flex';
    const fallback = `Bonjour, ici votre coach RestUp 👋 On fait le point cette semaine ?`;
    let msg = fallback;
    const cycle = planData ? (planData.cycles || []).find(cy => cy.active) : null;
    if (cycle) {
      const months = cycle.months || [];
      const monthIdx = Math.max(0, months.findIndex(m => m.current));
      const month = months[monthIdx] || months[0];
      const weeks = (month && month.weeks) || [];
      if (weeks.length) {
        let curIdx = weeks.findIndex(w => !w.locked && (w.tasks || []).some(t => !t.done));
        if (curIdx === -1) { for (let i = weeks.length - 1; i >= 0; i--) { if (!weeks[i].locked) { curIdx = i; break; } } }
        if (curIdx === -1) curIdx = 0;
        const curWeek = weeks[curIdx] || { tasks: [] };
        const curDone = (curWeek.tasks || []).filter(t => t.done).length;
        const curTotal = (curWeek.tasks || []).length;
        let lateCount = 0;
        weeks.forEach((w, i) => { if (i < curIdx && !w.locked) lateCount += (w.tasks || []).filter(t => !t.done).length; });
        msg = `Bonjour ${displayName} 👋 Récap ${curWeek.label || 'de la semaine'} : ${curDone}/${curTotal} tâches faites.`;
        msg += lateCount > 0
          ? ` Il vous reste ${lateCount} tâche${lateCount > 1 ? 's' : ''} en retard des semaines précédentes à boucler.`
          : ` Aucun retard, bravo !`;
        msg += ` On se cale un point cette semaine ? 💪\n— votre coach RestUp`;
      }
    }
    btn.href = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
    btn.style.display = 'inline-flex';
  }

  // Construit un brouillon de plan à partir des chiffres et paroles du client recueillis dans l'audit.
  // Banque de tâches par thème, piochée pour remplir les 16 semaines du plan (4 mois x 4 semaines).
  function taskBankFromAudit(ov, gj) {
    const banks = [];
    if (ov.margin_pct != null && ov.margin_pct < 15) {
      banks.push({
        priority: 'Redresser la marge nette (actuellement ' + ov.margin_pct + '%) : revoir la carte et les fournisseurs',
        tasks: ['Lister les 10 produits les moins rentables de la carte', 'Renégocier au moins un contrat fournisseur', 'Recalculer le coût matière de 5 plats phares', 'Ajuster les prix des plats les moins rentables', 'Retirer ou remplacer les 2 plats les moins rentables', 'Standardiser les fiches techniques restantes', 'Vérifier les grammages en cuisine sur une semaine'],
      });
    }
    if (ov.cash != null && ov.fixed_costs != null && ov.fixed_costs > 0 && ov.cash < ov.fixed_costs) {
      banks.push({
        priority: 'Reconstituer une trésorerie de sécurité (au moins 1 mois de charges fixes)',
        tasks: ['Mettre en place un suivi de trésorerie hebdomadaire', 'Identifier 3 postes de charges variables à réduire', 'Étaler ou renégocier une échéance si besoin', 'Fixer un seuil d\'alerte trésorerie', 'Revoir les délais de paiement fournisseurs', 'Constituer une réserve automatique chaque semaine'],
      });
    }
    if (ov.employees != null) {
      banks.push({
        priority: 'Structurer l\'équipe (' + ov.employees + ' collaborateurs) : plannings et rôles clairs',
        tasks: ['Formaliser les plannings et fiches de poste', 'Cadrer un point d\'équipe hebdomadaire', 'Clarifier les rôles en cuisine et en salle', 'Mettre en place un onboarding pour les nouveaux', 'Identifier un second capable de gérer un service', 'Formaliser les procédures d\'ouverture/fermeture'],
      });
    }
    if (gj.blocker) {
      banks.push({ priority: 'Lever le blocage identifié : ' + gj.blocker, tasks: ['Attaquer le blocage : ' + gj.blocker, 'Découper le blocage en 3 actions concrètes', 'Faire un point dédié avec le coach sur ce sujet'] });
    }
    if (!banks.length) {
      banks.push({ priority: 'Structurer les bases (finances, équipe, offre) avant d\'accélérer', tasks: ['Cadrer les 3 priorités du mois avec le coach', 'Mettre à plat les chiffres clés de la semaine', 'Clarifier les rôles de chacun', 'Formaliser un premier plan d\'action'] });
    }
    // Complète toujours avec des actions transverses pour garantir 7 tâches/semaine sur 16 semaines.
    banks.push({
      priority: 'Piloter l\'activité au quotidien',
      tasks: ['Mettre à jour le tableau de bord hebdomadaire', 'Analyser les ventes de la semaine avec l\'équipe', 'Recueillir 3 avis clients et en tirer une action', 'Vérifier la satisfaction de l\'équipe', 'Faire un point sur les stocks', 'Ajuster la communication (réseaux, carte du jour)'],
    });
    return banks;
  }

  function generatePlanFromAudit(a) {
    const ov = a.overview || {};
    const gj = a.growth_journey || {};
    const banks = taskBankFromAudit(ov, gj);
    const priorities = banks.map(b => b.priority);
    const allTasks = banks.flatMap(b => b.tasks);
    let taskCursor = 0;
    const nextTask = () => allTasks[(taskCursor++) % allTasks.length];

    const months = [1, 2, 3, 4].map(blankMonth);
    months[0].objective = priorities[0] || '';
    for (let mi = 0; mi < 4; mi++) {
      months[mi].weeks = [1, 2, 3, 4].map(wn => {
        const w = blankWeek(wn);
        // Seule la toute première semaine du plan reste débloquée : le reste se révèle semaine après
        // semaine avec le coach (LTV), pas donné d'un coup au client.
        w.locked = !(mi === 0 && wn === 1);
        const weekTasks = [];
        while (weekTasks.length < 7) weekTasks.push(nextTask());
        w.tasks = weekTasks.map(text => ({ text, done: false }));
        return w;
      });
    }

    return {
      status: 'draft',
      source_prompt: 'Généré automatiquement à partir de l\'audit (CA ' + fmtEuro(ov.revenue) + ', marge ' + (ov.margin_pct ?? '—') + '%, trésorerie ' + fmtEuro(ov.cash) + ').',
      contract_months: 4,
      vision_12m: { title: 'Objectifs pour les 12 prochains mois', items: gj.vision_12m ? [{ text: gj.vision_12m, done: false }] : [] },
      priorities_4m: { title: 'Objectifs pour les 4 prochains mois', items: priorities.map(text => ({ text, done: false })) },
      axes: [],
      cycles: [
        { name: 'Cycle 1', active: true, months },
        { name: 'Cycle 2', active: false, months: [] },
        { name: 'Cycle 3', active: false, months: [] },
      ],
    };
  }

  function getAtPath(obj, path) {
    const parts = path.match(/[^.[\]]+/g);
    return parts.reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }
  function setAtPath(obj, path, value) {
    const parts = path.match(/[^.[\]]+/g);
    let o = obj;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  function flattenPlanTasks(plan) {
    const out = [];
    (plan.cycles || []).forEach(cy => (cy.months || []).forEach(m => (m.weeks || []).forEach(w =>
      (w.tasks || []).forEach(t => out.push({ text: t.text, done: !!t.done, echeance: `${m.name || ''} — ${w.label || ''}` }))
    )));
    return out;
  }

  function renderActionTable(plan) {
    const rows = flattenPlanTasks(plan);
    if (!rows.length) return '<div class="empty-state">Aucune action définie pour le moment.</div>';
    return `<div class="table-scroll"><table class="action-table">
      <thead><tr><th>Action</th><th>Échéance</th><th>Statut</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${esc(r.text || '—')}</td>
        <td>${esc(r.echeance)}</td>
        <td><span class="action-status ${r.done ? 'adone' : 'atodo'}">${r.done ? 'Fait' : 'À faire'}</span></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  }

  // ---- Delegated events for the plan editor ----
  document.getElementById('planEditorRoot').addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset.path || el.type === 'checkbox' || el.type === 'radio') return;
    if (el.type === 'number') setAtPath(planData, el.dataset.path, el.value === '' ? null : Number(el.value));
    else setAtPath(planData, el.dataset.path, el.value);
  });
  document.getElementById('planEditorRoot').addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.checkbox && el.dataset.path) { setAtPath(planData, el.dataset.path, el.checked); }
    if (el.dataset.weekUnlock) {
      const ci = +el.dataset.ci, mi = +el.dataset.mi, wi = +el.dataset.wi;
      planData.cycles[ci].months[mi].weeks[wi].locked = !el.checked;
    }
    if (el.dataset.currentCycle !== undefined) {
      const ci = +el.dataset.currentCycle, mi = +el.dataset.currentMonth;
      planData.cycles[ci].months.forEach((m, i) => { m.current = (i === mi); });
    }
  });
  document.getElementById('planEditorRoot').addEventListener('click', (e) => {
    const el = e.target;
    if (el.dataset.removePath !== undefined) {
      const arr = getAtPath(planData, el.dataset.removePath);
      arr.splice(+el.dataset.removeIndex, 1);
      renderPlanEditor();
    } else if (el.dataset.addPath !== undefined) {
      const arr = getAtPath(planData, el.dataset.addPath);
      arr.push(el.dataset.addKind === 'string' ? '' : { text: '', done: false });
      renderPlanEditor();
    } else if (el.dataset.addAxis) {
      planData.axes.push({ name: '', subtitle: '', situation: '', actions: [] });
      renderPlanEditor();
    } else if (el.dataset.addMonth) {
      const ci = +el.dataset.ci;
      planData.cycles[ci].months.push(blankMonth(planData.cycles[ci].months.length + 1));
      renderPlanEditor();
    } else if (el.dataset.addWeek) {
      const ci = +el.dataset.ci, mi = +el.dataset.mi;
      planData.cycles[ci].months[mi].weeks.push(blankWeek(planData.cycles[ci].months[mi].weeks.length + 1));
      renderPlanEditor();
    }
  });

  document.getElementById('savePlanBtn').addEventListener('click', () => savePlan());

  document.getElementById('unlockWeekBtn').addEventListener('click', async () => {
    if (!planData) { if (window.toast) toast('Générez d\'abord une structure de plan', 'error'); return; }
    let found = null;
    outer:
    for (const cycle of planData.cycles) {
      for (const month of (cycle.months || [])) {
        for (const week of (month.weeks || [])) {
          if (week.locked) { found = week; break outer; }
        }
      }
    }
    if (!found) { if (window.toast) toast('Toutes les semaines sont déjà débloquées', 'ok'); return; }
    found.locked = false;
    await savePlan(true);
    // Une semaine débloquée = un call de suivi à programmer (une semaine = un call).
    await supabaseClient.from('calls').insert({ user_id: clientId, status: 'requested', notes: 'Call de suivi — ' + found.label });

    renderPlanEditor();
    renderCalls(await loadCalls());
  });

  document.getElementById('activateCycleBtn').addEventListener('click', async () => {
    if (!planData) { if (window.toast) toast('Générez d\'abord une structure de plan', 'error'); return; }

    if (!next) { if (window.toast) toast('Tous les cycles sont déjà actifs', 'ok'); return; }
    next.active = true;
    await savePlan(true);
    if (window.toast) toast('Cycle activé : ' + next.name, 'ok');
    renderPlanEditor();
  });

  function toLocalInputValue(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  // Construit un brouillon d'audit à partir d'une transcription de call (voir aussi admin/audits.html).
  function auditDraftFromPrompt(prompt) {
    return {
      status: 'draft',
      source_prompt: prompt,
      overview: { revenue: null, margin_pct: null, employees: null, fixed_costs: null, avg_sale: null, cash: null },
      growth_journey: { vision_12m: '', objective_4m: '', blocker: '' },

  function renderCalls(list) {
    const root = document.getElementById('callsRoot');
    if (!list.length) { root.innerHTML = '<div class="empty-state">Aucune demande de call pour ce client.</div>'; return; }
    root.innerHTML = list.map(c => `
      <div class="call-row" data-id="${c.id}">
        <div class="call-row-top">
          <select data-field="status">
            <option value="requested" ${c.status === 'requested' ? 'selected' : ''}>Demandé</option>
            <option value="confirmed" ${c.status === 'confirmed' ? 'selected' : ''}>Confirmé</option>
            <option value="done" ${c.status === 'done' ? 'selected' : ''}>Terminé</option>
          </select>
          <input type="datetime-local" data-field="scheduled_at" value="${toLocalInputValue(c.scheduled_at)}" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;color:#fff;font-family:inherit;font-size:13px;">
        </div>
        <div class="field"><label>Notes / transcription de l'appel</label><textarea rows="4" data-field="notes" placeholder="Collez ici vos notes ou la transcription du call...">${esc(c.notes || '')}</textarea></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button type="button" class="btn-primary magnetic save-call-btn" style="padding:9px 16px;font-size:13px;">Enregistrer</button>
          <button type="button" class="btn-secondary gen-audit-btn" style="padding:9px 16px;font-size:13px;">⚡ Générer l'audit à partir de cette transcription</button>
        </div>
      </div>`).join('');
    root.querySelectorAll('.call-row').forEach(row => {
      row.querySelector('.save-call-btn').addEventListener('click', async () => {
        const id = row.dataset.id;
        const status = row.querySelector('[data-field="status"]').value;
        const scheduledRaw = row.querySelector('[data-field="scheduled_at"]').value;
        const notes = row.querySelector('[data-field="notes"]').value;
        const { error } = await supabaseClient.from('calls').update({
          status,
          scheduled_at: scheduledRaw ? new Date(scheduledRaw).toISOString() : null,
          notes,
        }).eq('id', id);
        if (error) { if (window.toast) toast(error.message, 'error'); return; }
        if (window.toast) toast('Call mis à jour', 'ok');
      });
      row.querySelector('.gen-audit-btn').addEventListener('click', async () => {
        const notes = row.querySelector('[data-field="notes"]').value.trim();
        if (!notes) { if (window.toast) toast('Ajoutez des notes ou une transcription d\'abord.', 'error'); return; }
        if (auditRow && !confirm('Un audit existe déjà pour ce client. Le remplacer par un brouillon généré depuis cette transcription ?')) return;
        auditRow = { user_id: clientId, data: auditDraftFromPrompt(notes) };
        await upsertWithFallback('audits', clientId, auditRow.data);
        if (window.toast) toast('Audit généré depuis la transcription — à compléter puis publier', 'ok');
        switchTab('audit');
        renderAuditTab();
      });
    });
  }

  function renderChronologie() {
    const track = document.getElementById('chronoTrack');
    const stages = [{ label: 'Pré-audit', status: 'done' }];
    stages.push({ label: 'Audit', status: auditRow ? 'done' : 'current' });

    const cycle = (planData?.cycles || []).find(c => c.active) || planData?.cycles?.[0];
    const months = cycle?.months || [];
    let curIdx = months.findIndex(m => m.current);
    if (curIdx === -1 && months.length) curIdx = 0;
    months.forEach((m, i) => {
      let status = 'upcoming';
      if (auditRow) {
        if (curIdx === -1) status = 'upcoming';
        else if (i < curIdx) status = 'done';
        else if (i === curIdx) status = 'current';
      }
      stages.push({ label: m.name || ('Mois ' + (i + 1)), status });
    });

    track.innerHTML = stages.map(s => `
      <div class="chrono-stage ${s.status}">
        <span class="chrono-dot"></span>
        <span class="chrono-label">${esc(s.label)}</span>
      </div>`).join('');
  }

  // =========================================================
  // PARCOURS (mirrors client-side checklist, coach view)
  // =========================================================
  function renderParcoursAdmin(calls) {
    const root = document.getElementById('parcoursRoot');
    const doneCalls = calls.filter(c => c.status === 'done').length;
    const steps = [
      { icon: '<path d="M9 17l3-3 3 3M9 11l3-3 3 3"/><rect x="3" y="3" width="18" height="18" rx="2"/>', title: 'Auto-audit', sub: 'Diagnostic complet transmis par le client.', status: auditRow ? 'done' : 'todo' },
      { icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>', title: "Plan d'action", sub: 'Structure de plan créée pour ce client.', status: planData ? 'done' : (auditRow ? 'todo' : 'locked') },
      { icon: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', title: 'Premier call stratégique', sub: doneCalls ? doneCalls + ' call(s) réalisé(s)' : 'Aucun call terminé pour le moment.', status: doneCalls > 0 ? 'done' : (planData ? 'todo' : 'locked') },
    ];
    const badgeLabel = { done: 'Terminé', todo: 'À compléter', locked: 'Verrouillé' };
    root.innerHTML = steps.map(s => `
      <div class="parcours-step p${s.status}">
        <div class="parcours-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.status === 'done' ? '<path d="M20 6L9 17l-5-5"/>' : s.icon}</svg></div>
        <div class="parcours-body"><div class="parcours-title">${esc(s.title)}</div><div class="parcours-sub">${esc(s.sub)}</div></div>
        <span class="parcours-badge p${s.status}">${badgeLabel[s.status]}</span>
      </div>`).join('');
  }

  // ---- Init ----
  await loadCoaches();
  await loadAudit(); renderAuditTab();
  await loadPlan(); renderPlanEditor();
  renderWaRecap();
  document.getElementById('sendAccessBtn').addEventListener('click', async () => {
    const email = profile?.email;
    if (!email) { if (window.toast) toast('Ce client n\'a pas d\'email renseigné.', 'error'); return; }
    const btn = document.getElementById('sendAccessBtn');
    btn.disabled = true; btn.textContent = 'Envoi...';
    // Compte existant : renvoi du lien (ne crée jamais de compte).
    const { error } = await supabaseClient.auth.signInWithOtp({
      email, options: { shouldCreateUser: false, emailRedirectTo: PROD_ORIGIN + '/portail/set-password.html' }
    });
    btn.disabled = false; btn.textContent = '✉️ Envoyer les accès';
    if (error) { if (window.toast) toast(error.message, 'error'); return; }
    if (window.toast) toast('Email d\'accès envoyé à ' + email, 'ok');
    const waNumber = (profile?.phone || '').replace(/[^\d]/g, '');
    if (waNumber) window.open(document.getElementById('waWelcomeBtn').href, '_blank');
  });
  renderChronologie();
  renderGeneral();
  renderFinancier();
  renderCloser();
  renderNotes();
  renderKpis();
  renderDrive();
  const callsList = await loadCalls();
  const msgList = await loadMessages();
  renderParcoursAdmin(callsList);
  renderMessages(msgList);
  renderCalls(callsList);
  renderActivite(msgList, callsList);
  document.getElementById('newCallBtn').addEventListener('click', async () => {
    const { error } = await supabaseClient.from('calls').insert({ user_id: clientId, status: 'requested', notes: '' });
    if (error) { if (window.toast) toast(error.message, 'error'); return; }
    renderCalls(await loadCalls());
  });

  const jumpTab = params.get('tab');
  if (jumpTab) switchTab(jumpTab);
})();
</script>
</body>
</html>
