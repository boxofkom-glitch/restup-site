name: Mise en ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production : tarifs internes masqués ; échoue tant que les mentions légales manquent.
      - run: npm run build:production
        env:
          # Formulaire relié à la fonction submit_lead du projet Supabase (clé publique, protégée par RLS).
          PUBLIC_LEADS_ADAPTER: supabase
          PUBLIC_LEADS_ENDPOINT: https://etsxerdfshbkmqzfzzbi.supabase.co/rest/v1/rpc/submit_lead
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ulclSqYXAZvDITZzx8RC7A_DpwSjY27
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Étape ponctuelle : libère un déploiement Pages resté bloqué « en cours » (commit d609d5f).
      - name: Annuler le déploiement bloqué
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/deployments/d609d5f87ac7d123b6adadcbf0070fa4056a3c14/cancel
      - id: deployment
        uses: actions/deploy-pages@v4
