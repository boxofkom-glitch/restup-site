<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}

/* Vidéo d'intro : les étiquettes avancent vers l'écran. Jamais rognée sur grand écran (contenue en 16:9),
   recentrée sur le milieu sur téléphone. Elle passe ensuite à l'arrière-plan quand le titre arrive. */
.frame{position:relative;flex:0 0 auto;aspect-ratio:16/9;width:min(100vw,177.78vh);width:min(100vw,177.78dvh);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect}
@media (max-aspect-ratio:1/1){.frame{width:150vw}}
video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;background:#000;transform-origin:50% 50%;
  transition:filter 1.8s ease,transform 2.2s cubic-bezier(.16,1,.3,1),opacity 1.8s ease}
/* Jamais de bouton lecture natif (Safari) : la vidéo reste invisible tant qu'elle ne tourne pas vraiment */
video{pointer-events:none;visibility:hidden}
.vplay video{visibility:visible}
video::-webkit-media-controls,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-overlay-play-button,video::-webkit-media-controls-panel,video::-webkit-media-controls-enclosure{display:none !important;-webkit-appearance:none;opacity:0;pointer-events:none}
/* Secours si le navigateur refuse de lancer la vidéo (économie d'énergie) : mêmes étiquettes, animées en direct */
.fb{position:absolute;inset:0;pointer-events:none;display:none;overflow:hidden}
.fallback .fb{display:block}
.fallback video{opacity:0}
.arrived .fb{opacity:.14;filter:blur(6px);transition:opacity 1.6s,filter 1.6s}
.fb i{position:absolute;font-style:normal;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(13px,3.1vw,28px);padding:.7em 1.2em;border-radius:14px;color:#fff;
  background:linear-gradient(180deg,rgba(38,32,50,.92),rgba(18,15,26,.92));border:1px solid rgba(155,77,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 22px rgba(155,77,255,.18);
  opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(var(--r,0deg));animation:fly 4.6s cubic-bezier(.3,.1,.3,1) var(--d,0s) forwards}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.45) rotate(var(--r))}18%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(var(--r))}}
.arrived video{filter:blur(9px) brightness(.16) saturate(.8);transform:scale(1.18)}

.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s ease .3s;
  background:radial-gradient(48% 40% at 50% 46%,rgba(155,77,255,.34),rgba(74,36,130,.16) 45%,transparent 72%)}
.arrived .glow{opacity:1}
.rays{position:absolute;left:50%;top:46%;width:150vmax;height:150vmax;transform:translate(-50%,-50%) scale(.3);pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(155,77,255,.16) 0 2deg,transparent 2deg 9deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 0,transparent 62%);mask-image:radial-gradient(closest-side,#000 0,transparent 62%);
  transition:opacity 2s ease .2s,transform 3s cubic-bezier(.16,1,.3,1)}
.arrived .rays{opacity:1;transform:translate(-50%,-50%) scale(1)}

.hero{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:max(70px,env(safe-area-inset-top)) 22px max(64px,env(safe-area-inset-bottom));pointer-events:none}
.hero>*{pointer-events:auto}
/* Arrivée : du fond de l'écran vers le premier plan */
.from-depth{opacity:0;transform:scale(.22);filter:blur(16px);
  transition:opacity 1.1s ease,transform 1.7s cubic-bezier(.16,1,.3,1),filter 1.4s ease}
.arrived .from-depth{opacity:1;transform:none;filter:none}
.arrived .d1{transition-delay:.05s}.arrived .d2{transition-delay:.35s}.arrived .d3{transition-delay:.75s}.arrived .d4{transition-delay:1.05s}

h1{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.98;letter-spacing:.005em;font-size:clamp(46px,min(15vw,15.5vh),150px);color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.5)}
h1 b{display:block;font-weight:400;background:linear-gradient(180deg,#d2adff,#9B4DFF 70%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(155,77,255,.45))}
.sub{margin-top:clamp(14px,3vh,28px);font-size:clamp(13px,min(4vw,2.6vh),20px);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.88);line-height:1.5}
.sub b{display:block;color:#B37BFF;font-weight:700}
.cta{margin-top:clamp(20px,4.4vh,40px);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 34px;border-radius:999px;
  background:rgba(11,7,16,.86);border:1.5px solid #9B4DFF;color:#fff;text-decoration:none;font-weight:600;font-size:16px;
  box-shadow:0 0 28px rgba(155,77,255,.5),inset 0 0 18px rgba(155,77,255,.22);transition:box-shadow .2s,transform .18s,opacity 1.1s ease,filter 1.4s ease}
.cta:hover{box-shadow:0 0 44px rgba(179,123,255,.85),inset 0 0 22px rgba(155,77,255,.38)}
.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px;flex:0 0 auto}
.member{margin-top:clamp(12px,2.4vh,20px);color:rgba(255,255,255,.7);font-size:13.5px;font-weight:600;text-decoration:none;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.22)}
.member:hover{color:#fff;border-color:#9B4DFF}
.cta:focus-visible,.member:focus-visible,.mark:focus-visible{outline:2px solid #fff;outline-offset:3px}

.mark{position:fixed;z-index:5;left:max(20px,env(safe-area-inset-left));top:max(18px,env(safe-area-inset-top));font-family:Anton,Impact,sans-serif;font-size:30px;letter-spacing:.01em;color:#fff;text-decoration:none;line-height:1}
.mark span{color:#B37BFF}
@media (max-height:560px){.sub{display:none}h1{font-size:clamp(34px,13vh,80px)}.hero{padding-top:56px}}
@media (prefers-reduced-motion:reduce){video,.from-depth,.glow,.rays{transition:none}}
</style>

<link rel="apple-touch-icon" href="/portail/apple-touch-icon.png">

<body>
<a class="mark" href="index.html" aria-label="RESTUP, accueil">REST<span>UP</span></a>
<main class="stage" id="stage">
  <div class="frame">
    <video id="v" autoplay muted playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" tabindex="-1" aria-hidden="true"><source src="assets/video/intro-tags.mp4" type="video/mp4"></video>
    <div class="fb" id="fb"><i style="left:28%;top:24%;--r:-4deg;--d:0s">Service</i><i style="left:56%;top:16%;--r:3deg;--d:0.15s">Équipe</i><i style="left:70%;top:27%;--r:-6deg;--d:0.3s">Planning</i><i style="left:28%;top:50%;--r:2deg;--d:0.2s">Stocks</i><i style="left:66%;top:47%;--r:-3deg;--d:0.1s">Marge</i><i style="left:32%;top:72%;--r:4deg;--d:0.35s">Coûts</i><i style="left:66%;top:70%;--r:-2deg;--d:0.25s">Pression</i></div>
  </div>
  <div class="glow"></div><div class="rays"></div>
  <div class="hero">
    <h1 class="from-depth d1">Tu gères<b>tout.</b></h1>
    <p class="sub from-depth d2">Et si tu recommençais<b>à diriger ?</b></p>
    <a class="cta from-depth d3" href="decouvrir.html">Découvrir <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="member from-depth d4" href="portail/login.html">Je suis déjà membre</a>
  </div>
</main>
<script>
(function(){
  // Appli installée : un client déjà connecté va directement dans son espace
  try{ var app=(matchMedia('(display-mode: standalone)').matches||navigator.standalone===true); var has=false;
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i); if(/^sb-.*-auth-token$/.test(k)){has=true;break;}}
    if(app&&has){location.replace('portail/login.html');return;} }catch(e){}
  var stage=document.getElementById('stage'), v=document.getElementById('v'), on=false;
  function arrive(){ if(on) return; on=true; stage.classList.add('arrived'); }
  // Lancement automatique et fiable : muet obligatoire pour que les navigateurs autorisent la lecture sans clic
  v.muted=true; v.defaultMuted=true; v.setAttribute('muted',''); v.playsInline=true;
  var started=false;
  function tryPlay(){ if(started) return; var p=v.play(); if(p&&p.catch) p.catch(function(){}); }
  v.addEventListener('playing',function(){started=true;stage.classList.add('vplay');});
  ['loadedmetadata','loadeddata','canplay','canplaythrough'].forEach(function(e){v.addEventListener(e,tryPlay);});
  tryPlay();
  // Certains navigateurs (économie d'énergie) attendent un premier geste : le moindre contact lance la vidéo
  ['touchstart','pointerdown','keydown','scroll','click'].forEach(function(e){window.addEventListener(e,tryPlay,{passive:true,once:true});});
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) tryPlay(); });
  window.addEventListener('pageshow',tryPlay);
  // Le titre arrive du fond dès que les étiquettes sont bien proches de l'écran
  function watch(){ if(on) return; if(v.ended || (v.currentTime||0)>=4.6) arrive(); else requestAnimationFrame(watch); }
  v.addEventListener('playing',function(){requestAnimationFrame(watch)});
  v.addEventListener('ended',arrive);
  // Vidéo vraiment impossible à lire (ou réseau très lent) : le titre arrive quand même
  // Lecture refusée : on joue les étiquettes en direct, puis le titre arrive (une fois la vidéo lancée par un contact, on repasse dessus)
  setTimeout(function(){ if(!started && !on){ stage.classList.add('fallback'); setTimeout(arrive,4300); } },1200);
  v.addEventListener('playing',function(){ stage.classList.remove('fallback'); });
  setTimeout(function(){ if(!on && !started) arrive(); },9000);
  setTimeout(function(){ if(!on && (v.currentTime||0)<0.3) arrive(); },14000);
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("/sw.js",{scope:"/"}).catch(function(){});}</script>
